schema=worldline.optimization.v1
id=worldline.runtime.time-dilation
summary=Dilate wall-clock time uniformly inside pooled Linux containers so paced official runtimes finish sooner.
subsystem=verification.runtime
status=candidate
default.enabled=false
behavior.delta=Absent configuration keeps every container invocation byte-identical; an enabled factor scales CLOCK_* time for the whole container (harness, wire client, and official server together) without touching any game code.
risks=Uneven dilation between processes or a runtime sensitive to absolute time could desynchronize pacing and forge latency evidence; activation requires the differential proof program in docs/TIME_DILATION.md.
rollback=Delete tools/containers/time-dilation.properties; loading then returns the disabled dilation.
tracking=symbol
source.symbols=TimeDilation#load
evidence=tools/containers/TimeDilation#main
