schema=worldline.optimization.v1
id=worldline.gate.token-fingerprints
summary=Hash Java smoke inputs as canonical token streams so comment and formatting edits stop invalidating PASS proofs.
subsystem=verification.gate
status=active
default.enabled=true
behavior.delta=Changes only which edits invalidate qualification fingerprints; any character or token-adjacency change still reruns, and collapsed differences are limited to comments and whitespace placement.
risks=A tokenizer defect that merged semantically different sources could carry a stale PASS; literals stay verbatim and adjacency is preserved to keep every collapse formatting-only.
rollback=Revert the worldline-smoke-input-v6-tokens algorithm through a reviewed pin migration back to byte-portable hashing.
tracking=symbol
source.symbols=JavaTokenText#canonical
evidence=tools/harness/JavaTokenText#selfTest
