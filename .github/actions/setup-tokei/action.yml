name: Setup pinned tokei
description: Restore the pinned source counter or install it once on cache miss
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/tokei
          ~/.cargo/bin/tokei.exe
        key: worldline-tokei-${{ runner.os }}-14.0.0
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install tokei --version 14.0.0 --locked
    - shell: bash
      run: tokei --version
