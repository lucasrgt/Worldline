name: TestKit external consumer
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: testkit-external-consumer-${{ github.ref }}-${{ matrix.java }}
  cancel-in-progress: false
jobs:
  portal-consumer:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download the published TestKit runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/worldline-testkit"
          gh release download testkit-v0.3.0 --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/worldline-testkit" --clobber
          cd "$RUNNER_TEMP/worldline-testkit"
          sha256sum --check <(awk -F= '/[.]jar=/{print $2 "  " $1}' checksums.properties)
      - name: Generate a project outside the repository
        shell: bash
        run: |
          java -jar "$RUNNER_TEMP/worldline-testkit/worldline-test-runner-0.3.0.jar" \
            init --target="$RUNNER_TEMP/consumer" --template=gui
          test ! -e "$RUNNER_TEMP/consumer/local-maven"
          test ! -e "$RUNNER_TEMP/consumer/.local/oracles"
      - name: Resolve from the Plugin Portal without an official client JAR
        shell: bash
        run: |
          cd "$RUNNER_TEMP/consumer"
          ./gradlew tasks --no-daemon --stacktrace | tee "$RUNNER_TEMP/consumer.log"
          grep -E 'worldlineDoctor|worldlineTest' "$RUNNER_TEMP/consumer.log"
          test ! -e .local/oracles
