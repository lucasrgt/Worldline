name: Publish TestKit
on:
  push:
    tags:
      - testkit-v*
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.12+8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Install pinned source counter
        run: cargo install tokei --version 14.0.0 --locked
      - name: Verify and package
        run: |
          java tools/harness/Verify.java
          java tools/testkit/TestKitPackage.java
      - name: Verify frozen distribution identities
        run: |
          echo "279825b2317ccc27b6a5a19f32b65b6883beb6582d0a89bbebbeecb1f690c4c9  .worldline/dist/testkit/worldline-test-api-0.2.1.jar" | sha256sum --check
          echo "b5b992369d2b6b1b5eb8504b34cac41eadfbded3fb3dbe97d7f19a15bc7b043b  .worldline/dist/testkit/worldline-test-runner-0.2.1.jar" | sha256sum --check
      - name: Validate Gradle plugin
        run: gradle -p tooling/gradle-plugin --project-cache-dir .worldline/gradle-plugin/cache test validatePlugins
      - name: Publish pinned release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .worldline/dist/testkit/worldline-test-api-*.jar
            .worldline/dist/testkit/worldline-test-runner-*.jar
            .worldline/dist/testkit/checksums.properties
      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: gradle -p tooling/gradle-plugin --project-cache-dir .worldline/gradle-plugin/cache publishPlugins
