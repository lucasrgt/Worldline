name: Publish TestKit
on:
  push:
    tags:
      - testkit-v*
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORLDLINE_CONTROL_DIR: ${{ github.workspace }}/.worldline/control
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - uses: ./.github/actions/setup-tokei
      - name: Restore content-addressed Gate cache
        uses: actions/cache@v4
        with:
          path: .worldline/control/cache
          key: worldline-gate-${{ runner.os }}-java21-${{ github.sha }}
          restore-keys: |
            worldline-gate-${{ runner.os }}-java21-
      - name: Verify and package
        shell: bash
        run: |
          set +e
          java tools/harness/Gate.java
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            if [[ ! -f .worldline/reports/verify.json ]] ||
                ! grep -Fq 'cold gate latency SLO exceeded:' .worldline/reports/verify.json; then
              exit "$status"
            fi
            echo 'Cold verification passed but exceeded its SLO; measuring the warmed gate.'
            java tools/harness/Gate.java
          fi
          java tools/testkit/TestKitPackage.java
      - name: Bind generated checksums to release tag
        run: java tools/testkit/TestKitReleaseCheck.java "$GITHUB_REF_NAME"
      - name: Publish Gate timing summary
        if: always()
        run: |
          if [[ -f .worldline/gate/classes/VerifySummary.class ]]; then
            java -cp .worldline/gate/classes VerifySummary >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Worldline Gate\n\nNo `verify.json` was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate Gradle plugin
        run: gradle -p tooling/gradle-plugin --project-cache-dir .worldline/gradle-plugin/cache test validatePlugins
      - name: Publish pinned release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .worldline/dist/testkit/worldline-test-api-*.jar
            .worldline/dist/testkit/worldline-test-runner-*.jar
            .worldline/dist/testkit/checksums.properties
      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: gradle -p tooling/gradle-plugin --project-cache-dir .worldline/gradle-plugin/cache publishPlugins
