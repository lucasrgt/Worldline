name: Private Runtime Verification

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Runtime tier to execute
        type: choice
        options: [runtime, milestone, full-smoke, quality]
        default: runtime
      milestone_id:
        description: Milestone ID used by the isolated milestone tier
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: worldline-official-b173-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: [self-hosted, worldline-runtime]
    timeout-minutes: 1440
    env:
      WORLDLINE_TEST_CACHE_RECHECK_PERCENT: '10'
      WORLDLINE_TEST_CACHE_RECHECK_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+8'
      - uses: ./.github/actions/setup-tokei
      - name: Verify runtime inputs
        if: github.event_name == 'schedule' || inputs.profile == 'runtime'
        run: java tools/harness/Gate.java --runtime
      - name: Verify repository for quality campaign
        if: inputs.profile == 'quality'
        run: java tools/harness/Gate.java
      - name: Doctor all shared caches
        if: github.event_name == 'schedule' || inputs.profile == 'quality'
        run: java tools/harness/Gate.java --cache-doctor
      - name: Drill cold static-cache reconstruction
        if: github.event_name == 'schedule' || inputs.profile == 'quality'
        run: java tools/harness/Gate.java --cache-rebuild-drill
      - name: Run bounded nightly fuzz and mutation campaigns
        if: github.event_name == 'schedule' || inputs.profile == 'quality'
        run: >-
          java -cp .worldline/gate/classes NightlyQualityCampaign
          --budget-seconds 900 --seed ${{ github.run_id }}
      - name: Verify one milestone
        if: inputs.profile == 'milestone'
        shell: bash
        env:
          WORLDLINE_MILESTONE_ID: ${{ inputs.milestone_id }}
        run: java tools/harness/Gate.java --milestone "$WORLDLINE_MILESTONE_ID"
      - name: Plan missing smoke proofs
        if: github.event_name == 'schedule' || inputs.profile == 'full-smoke'
        run: java tools/harness/Gate.java --smoke-plan
      - name: Run missing server smokes in the Runtime Fabric
        if: github.event_name == 'schedule' || inputs.profile == 'full-smoke'
        shell: pwsh
        run: |
          $manifest = '.worldline/runtime-plan/server-headless.tsv'
          if (Select-String -Path $manifest -Pattern '^[^#\s]' -Quiet) {
            java tools/containers/RuntimeFabric.java run $manifest --backend docker --jobs auto --skip-verify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run missing GUI smokes in the Runtime Fabric
        if: github.event_name == 'schedule' || inputs.profile == 'full-smoke'
        shell: pwsh
        run: |
          $manifest = '.worldline/runtime-plan/windows-client-gui.tsv'
          if (Select-String -Path $manifest -Pattern '^[^#\s]' -Quiet) {
            java tools/containers/RuntimeFabric.java run $manifest --backend windows-job --jobs auto --skip-verify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run missing tooling milestones
        if: github.event_name == 'schedule' || inputs.profile == 'full-smoke'
        shell: pwsh
        run: |
          Get-Content '.worldline/runtime-plan/tooling.tsv' |
            Where-Object { $_ -match '^[^#\s]' } |
            ForEach-Object {
              $id = ($_ -split "`t")[0]
              java tools/harness/Gate.java --milestone $id
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
      - name: Pin all current proofs
        if: github.event_name == 'schedule' || inputs.profile == 'full-smoke'
        run: java tools/harness/Gate.java --pin-smokes
      - name: Update reviewed smoke scheduling history
        if: always() && (github.event_name == 'schedule' || inputs.profile == 'full-smoke')
        shell: pwsh
        run: |
          if (Test-Path '.worldline/gate/classes/SmokeScheduleHistory.class') {
            java -cp .worldline/gate/classes SmokeScheduleHistory update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            java -cp .worldline/gate/classes ReadmeStatus update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Open reviewed smoke-pin pull request
        if: always() && github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (git diff --quiet -- README.md smokes/qualification.lock smokes/qualification-evidence smokes/schedule.properties) { exit 0 }
          $branch = "automation/smoke-pins-$env:GITHUB_RUN_ID"
          git config user.name 'worldline-automation'
          git config user.email 'worldline-automation@users.noreply.github.com'
          git switch -c $branch
          git add README.md smokes/qualification.lock smokes/qualification-evidence smokes/schedule.properties
          git commit -m 'Update reviewed smoke qualification and scheduling evidence'
          git push origin $branch
          gh pr create --base main --head $branch --title 'Update reviewed smoke evidence' --body 'Nightly Runtime Fabric sweep completed. This PR contains portable smoke pins and reviewed failure/duration scheduling history only.'
      - name: Publish Gate timing summary
        if: always()
        shell: bash
        run: |
          if [[ -f .worldline/gate/classes/VerifySummary.class ]]; then
            java -cp .worldline/gate/classes VerifySummary >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Worldline Gate\n\nNo `verify.json` was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-reports
          path: |
            .worldline/reports
            .worldline/smoke-logs
