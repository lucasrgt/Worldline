name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WORLDLINE_CONTROL_DIR: ${{ github.workspace }}/.worldline/control
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: ./.github/actions/setup-tokei
      - name: Restore content-addressed Gate cache
        uses: actions/cache@v4
        with:
          path: .worldline/control/cache
          key: worldline-gate-${{ runner.os }}-java21-${{ github.sha }}
          restore-keys: |
            worldline-gate-${{ runner.os }}-java21-
      - name: Exercise cross-platform gate lock
        run: java tools/harness/Gate.java --self-test
      - name: Verify repository
        shell: bash
        run: |
          set +e
          java tools/harness/Gate.java
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if [[ ! -f .worldline/reports/verify.json ]] ||
              ! grep -Fq 'cold gate latency SLO exceeded:' .worldline/reports/verify.json; then
            exit "$status"
          fi
          echo 'Cold verification passed but exceeded its SLO; measuring the warmed gate.'
          java tools/harness/Gate.java
      - name: Publish Gate timing summary
        if: always()
        shell: bash
        run: |
          if [[ -f .worldline/gate/classes/VerifySummary.class ]]; then
            java -cp .worldline/gate/classes VerifySummary >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Worldline Gate\n\nNo `verify.json` was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ matrix.os }}
          path: .worldline/reports
