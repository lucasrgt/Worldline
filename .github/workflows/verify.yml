name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WORLDLINE_CONTROL_DIR: ${{ github.workspace }}/.worldline/control
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.12+8'
      - uses: ./.github/actions/setup-tokei
      - name: Restore content-addressed Gate cache
        uses: actions/cache@v4
        with:
          path: .worldline/control/cache
          key: worldline-gate-${{ runner.os }}-java21-${{ github.sha }}
          restore-keys: |
            worldline-gate-${{ runner.os }}-java21-
      - name: Exercise cross-platform gate lock
        run: java tools/harness/Gate.java --self-test
      - name: Verify repository
        run: java tools/harness/Gate.java
      - name: Publish Gate timing summary
        if: always()
        shell: bash
        run: |
          if [[ -f .worldline/gate/classes/VerifySummary.class ]]; then
            java -cp .worldline/gate/classes VerifySummary >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Worldline Gate\n\nNo `verify.json` was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ matrix.os }}
          path: .worldline/reports
