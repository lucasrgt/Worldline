title = "Separate cycle and child-process timeouts"
lesson = "A descriptor timeout used inside a multi-arm runner must not also bound each child process. Keep timeout.seconds as the Gate-owned outer supervisor limit and give the runner a distinct child.timeout.seconds value so cleanup remains bounded without truncating valid multi-arm qualification or changing the shared SmokeProcess fingerprint."
