title = "Exclude mutable surface decoration from terrain portability matrices"
lesson = "Fresh official Beta 1.7.3 worlds can produce equal non-air counts and solid-occupancy planes while a top-surface block or metadata differs between replicas because population decoration is not a stable cross-lane oracle. Cross-lane terrain matrices must freeze generation-stable occupancy and explicitly bound mutable decoration out unless population order is independently controlled."
