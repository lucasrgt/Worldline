title = "Revalidate immutable module cache after a concurrent publish collision"
lesson = "On Windows, concurrent Gates can race while publishing the same immutable module digest and one atomic directory move may fail with AccessDenied after another publisher wins. Preserve the first Gate log and digest, classify that boundary RETRYABLE, then permit one bounded rerun only after the target digest exists; a successful cache reuse proves non-recurrence, while another collision requires repairing the publisher instead of repeating indefinitely."
