title = "Reject held-map marker fixtures with no official marker packets"
lesson = "A held-map player-marker contract is not proven merely because two official Beta 1.7.3 players hold the same map item and map_0.dat exists. The fixture must first observe Packet131 kind-1 marker triples on the holder connection. If a bounded official cycle produces count=0 before the rotation/removal oracle, preserve the server and cycle logs, reject the contract after the retry limit, and do not promote the static decoder or TestKit surface."
