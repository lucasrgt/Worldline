id = "NYA-01M20Y78R77X1BPG78BCA1E5CJ"
title = "Reuse compiled API products in legacy smoke compilers"
lesson = "A legacy smoke runner can exceed the Windows CreateProcess command-length limit when it recompiles every API source using absolute worktree paths, even after the candidate gate passed. Consume the Gate-compiled API and required sibling products on both compile and runtime classpaths, and compile only the actual adapter and scenario closure. When a full source compilation is required, use a compiler argument file. Preserve the first launch failure and qualify the unchanged official oracle after correcting the launcher."
