title = "Block rejected semantic contracts across milestone IDs"
lesson = "A rejected contract remains excluded by semantic identity, not by milestone number. Before worker preflight and again before Candidate, compare the proposed ID and goal with the evidence-bound rejection registry; reject replacement IDs such as M660 after M674. Revalidation is allowed only on the same milestone after an objective harness, fixture, or oracle change hash is recorded and historical negative plus valid positive fixtures pass."
