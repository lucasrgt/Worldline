schema = 1
id = "NYA-01M0VSCA8F3WSMVW32R9XME7DQ"
title = "Do not strand milestone workers behind unsupervised delegation"
lesson = "A non-interactive milestone worker whose launcher does not supervise nested agents must inspect the repository directly. Unsupervised task or explore delegation can leave only the fail-closed scaffold with no real contract. Before scaffolding, recall applicable NYA scars; if official evidence or available fixtures cannot produce a reusable contract, stop REJECTED and record the exact reusable failure in NYA before scheduling a replacement. Never hand off a draft scaffold."
