title = "Seal OpenCode session exports without shell redirection"
lesson = "Legacy resume-session adoption must obtain immutable evidence by invoking the exact OpenCode export process directly, closing stdin, redirecting stdout and stderr to distinct regular files, strictly validating session and real worktree, and publishing atomically at the canonical path. Adoption must reparse that evidence and bind milestone, session, worktree, and SHA-256 in one receipt. Do not rely on mutable logs, shell redirection, or --sanitize because sanitization removes the required worktree identity."
