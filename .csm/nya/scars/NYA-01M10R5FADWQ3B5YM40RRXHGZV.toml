title = "Enumerate unowned retries as STRANDED instead of aborting the census"
lesson = "An exact census must validate every explicit RETRYABLE archive yet still emit all worktrees requiring supervision. When owner, session, or attempt budget is missing, preserve the declared RETRYABLE identity but classify the effective row STRANDED with the exact defect list. Wave release remains blocked, while the supervisor receives a complete machine-readable adoption queue instead of only the first exception."
