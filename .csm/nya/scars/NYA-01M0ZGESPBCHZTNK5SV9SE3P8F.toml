title = "Balance control parentheses before classifying packed bodies"
lesson = "A packed-control readiness regex must inspect the body after the matching closing parenthesis of if, for, or while. Greedy matching against any earlier closing parenthesis falsely rejects valid braced controls containing nested calls or multiline conditions. Use a balanced-parenthesis scanner, keep callable-body detection separate, and self-test both a nested braced control that must pass and a nested inline throw that must fail."
