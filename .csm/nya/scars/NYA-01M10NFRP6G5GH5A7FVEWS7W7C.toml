title = "Reject fail-open normalization of explicitly rejected evidence"
lesson = "A structural admission or policy fixture must never normalize evidence explicitly marked rejected into ALLOWED merely because its explanatory reason is null. Readiness or semantic review must fail closed, preserve the exact receipt as mechanically valid but semantically superseded, and exclude the contract until an objective official-oracle binding and positive/negative proof exist."
