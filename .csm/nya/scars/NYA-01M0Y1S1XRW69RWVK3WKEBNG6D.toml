schema = 1
id = "NYA-01M0Y1S1XRW69RWVK3WKEBNG6D"
title = "Do not truncate applicable-scar recall before Candidate"
lesson = "A supervised pre-Candidate loop must request enough NYA results to include every scar it declares applicable. The default recall limit can rank a required scar below the cutoff even when its scope matches; derive the recall limit from the complete local scar store, require each declared ID in the returned evidence, and keep Candidate blocked until the exact manifest-bound recall passes."
