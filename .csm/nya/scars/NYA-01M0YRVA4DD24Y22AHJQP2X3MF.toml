title = "Honor each module Java release before Candidate"
lesson = "Every maintained source must compile at the Java release declared for its owning module in harness.properties. modules/api defaults to release 8, so public behavior contracts there must use Java 8 classes with explicit value equality instead of records; release-21 TestKit types do not raise the API module language level. Keep the exact pre-Candidate ModuleBuild compilation fail-closed and never relax its release to accommodate an invalid source."
