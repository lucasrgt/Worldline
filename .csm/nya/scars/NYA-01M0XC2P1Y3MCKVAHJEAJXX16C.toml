id = "NYA-01M0XC2P1Y3MCKVAHJEAJXX16C"
title = "Do not infer portal cooldown from a wait-only roundtrip"
lesson = "A portal re-entry cooldown contract must pair a bounded non-transition while the same player remains in continuous contact with the arrival portal with a positive control in which that player exits the portal collision region and re-enters. A roundtrip after an arbitrary wait proves eventual travel but does not causally prove re-entry suppression."
