title = "Budget fallback retries for large session histories"
lesson = "A provider fallback that resumes a 300k-token-or-larger OpenCode session can make correct progress yet exceed the primary one-hour checkpoint budget. Before launch, measure or conservatively classify resumed-session history, use a bounded extended checkpoint timeout for the allowlisted fallback, require periodic JSONL progress, and never interpret timeout as contract rejection. Keep Candidate and runtime blocked until an explicit checkpoint disposition."
