title = "Regenerate milestone narratives and preserve source ratchets"
lesson = "Milestone narrative documents are generated from smoke.properties. After changing narrative fields, run MilestoneNarrative for the milestone before Candidate Gate; hand-authored wrapping or wording can compile yet fail the exact drift check. Candidate output that reports packed smoke lines must also be corrected before commit even when the candidate tier passes: split statements across physical lines so the canonical zero-growth ratchet remains satisfied."
