title = "Bind workers to the orchestrator control base"
lesson = "A supervisor can run current readiness against an old milestone worktree whose Candidate Gate still contains stale checks. Every Ox Alpha attempt must record an exact orchestrator control-base SHA and fail before OpenCode starts unless that SHA is an ancestor of both the authorized milestone base and worktree HEAD. When controls advance during a wave, archive the attempt and rebase the same milestone onto the new authorized base before retrying; never mix a current readiness receipt with an older Gate implementation."
