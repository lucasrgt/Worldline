title = "Place OpenCode message before variadic file attachments"
lesson = "The installed opencode run CLI treats -f/--file as a variadic array. A supervised launcher must place the positional message before every -f attachment, validate that ordering in a self-test, inject the Ox Alpha permission profile with task denied, and preserve stdout/stderr plus exit code. Passing the message after -f makes OpenCode treat the full prompt as a file path and starts no worker."
