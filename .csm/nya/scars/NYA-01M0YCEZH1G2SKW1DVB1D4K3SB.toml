title = "Do not make minecart collision evidence depend on an unconfirmed remote barrier placement"
lesson = "A minecart collision fixture must not treat an optional remotely placed barrier as established merely because the placement request was sent. If the barrier is not the behavior under test, use deterministic pre-provisioned geometry or remove it; if it is required, observe the exact block state before proceeding. Preserve the bounded placement timeout and never start the collision oracle after expected block state absent."
