title = "Never promote fingerprints without verified evidence bytes"
lesson = "Portable qualification pins must bind a reviewed fingerprint to repository-tracked evidence bytes and verify the envelope digest before restoration; missing or corrupt evidence fails closed. When a reviewed shared input changes a computed fingerprint without changing the official observation, a refactor-equivalent migration must rewrite the tracked proof envelope and qualification lock to the same envelope digest while preserving the observation hash. Long-running coordinators must terminate descendants in reverse order and confirm death, immutable cache publishers must never replace existing digest directories, and lease tickets must bind PID plus process start time."
