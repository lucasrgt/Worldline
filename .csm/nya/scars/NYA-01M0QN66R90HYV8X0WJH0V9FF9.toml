title = "Never promote fingerprints without verified evidence bytes"
lesson = "Portable qualification pins must bind a reviewed fingerprint to repository-tracked evidence bytes and verify the envelope digest before restoration; missing or corrupt evidence fails closed. Long-running coordinators must terminate descendants in reverse order and confirm death, immutable cache publishers must never replace existing digest directories, and lease tickets must bind PID plus process start time."
