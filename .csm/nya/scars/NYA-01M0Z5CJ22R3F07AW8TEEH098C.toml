title = "Close supervised child stdin before waiting"
lesson = "A Java ProcessBuilder gives the OpenCode child a writable stdin pipe. The supervised launcher must close process.getOutputStream immediately after start, before waitFor, because opencode run reads non-interactive stdin to EOF before creating its session. Add a self-test child mode that blocks on stdin and prove the launcher closes it; an open pipe can leave every parallel worker alive with zero session, zero output, and zero edits."
