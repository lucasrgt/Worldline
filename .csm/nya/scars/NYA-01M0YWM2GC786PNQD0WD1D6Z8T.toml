title = "Require a clean committed tree before train pin migration"
lesson = "TrainPinMigration derives source history from git diff against the historical base, so untracked files are invisible. Before migration, require git status --porcelain --untracked-files=all to be empty and run only on the exact committed source tree; the migration itself may then write portable pins and the reconciliation lock. Never seal source ancestry from a dirty or partially staged train."
