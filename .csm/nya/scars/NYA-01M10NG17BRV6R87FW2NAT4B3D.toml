title = "Require fixture reachability before retrying a behavioral oracle"
lesson = "When every bounded official execution fails before the intended oracle because the fixture cannot establish its initial observable state, count the actual executions against the retry limit and reject the milestone as fixture-oracle-insufficient. Revalidation requires an objective fixture change plus a negative proof on the archived artifact and a positive proof that the prerequisite state is reached; metadata attempt counters may not override runtime history."
