title = "Preserve distinct control-migration history bases"
lesson = "A preserved worker checkpoint may have an archive and preflight bound to one authorized base while its last completed supervised receipt is bound to a later control base. Validate and seal archive_base, preflight_base, and receipt_base independently, require their exact ancestry into the new control base, and never collapse them into one old-base value or fabricate replacement evidence."
