title = "Resolve cached module links before TestKit packaging"
lesson = "A hot Gate can expose compiled modules through platform-specific links: Java Files.walk does not descend through a Linux symbolic-link root. Release packaging must resolve each immutable module directory to its real path and fail closed unless every artifact contains classes and the runner has the expected entry point."
scope = [
    "tools/testkit/**",
    ".github/workflows/publish-testkit.yml",
]
