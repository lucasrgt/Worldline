title = "Fail over supervised fallback provider errors without replacing work"
lesson = "An allowlisted free fallback can make useful checkpoint progress and later return a non-retryable upstream 404 for every concurrent session. Classify the attempts as infrastructure RETRYABLE, archive each exact receipt/log/patch, and resume the same sessions on a different explicitly allowlisted free model. The launcher must reject arbitrary model names and record the selected model; never create replacement IDs or interpret provider transport failure as a rejected contract."
