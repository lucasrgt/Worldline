title = "Stop workers after a terminal Gate failure"
lesson = "When a supervised Ox Alpha worker receives a completed nonzero Candidate or Milestone Gate result, the result is terminal for that attempt. Preserve the immutable JSONL and receipt, allow only a short bounded grace period for the final RETRYABLE or REJECTED disposition, then terminate the exact OpenCode process tree. Do not let a low-cost model spend dozens of repository reads diagnosing or editing after the frozen Gate result; diagnosis and correction belong to the next supervised checkpoint in the same milestone, worktree, and session."
