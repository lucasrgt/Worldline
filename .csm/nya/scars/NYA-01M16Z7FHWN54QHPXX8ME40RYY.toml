title = "Empty probe directories broke milestone ID uniqueness"
lesson = "Interrupted scaffold or narrative probes leave empty untracked smokes/<id> directories that MilestoneIdUniquenessCheck counted as milestone namespaces, failing the gate with a phantom collision. A directory without any file is not a namespace: skip genuinely empty directories in the uniqueness census and delete such orphans instead of adding collision allowances."
