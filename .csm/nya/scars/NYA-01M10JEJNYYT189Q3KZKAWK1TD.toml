lesson = "A disposition-aware census must not discard audited first-pass, recurrence, attempt, prevention, or receipt-time telemetry from an earlier immutable census, and it must not carry those metrics by milestone ID alone. Accept a baseline only as an explicit input, bind every carried row to exact id+head, prefer exact tracked disposition fields, emit the baseline SHA-256, and leave metrics unknown when head continuity cannot be proven."
