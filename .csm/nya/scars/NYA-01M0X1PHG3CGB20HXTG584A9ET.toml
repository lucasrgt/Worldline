title = "Prove the redstone source transition before asserting its consumer"
lesson = "An official redstone fixture cannot attribute a missing consumer update to edge semantics when it never observes the source control changing state. Await the lever metadata transition and use a previously oracled power topology before waiting for a torch or note event; after the bounded worker limit, an absent pre-oracle Packet53 transition makes the fixture unable to prove the contract and the milestone must be REJECTED with its runtime evidence archived."
