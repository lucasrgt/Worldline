title = "Classify fixed tick windows before polling migration"
lesson = "A sustainTicks call followed by an assertion is not always a race: preserve intentional tick-duration claims behind a telemetered observation-window contract, use awaitSlot/awaitBlock/awaitEntity for asynchronous conditions, and require migration transforms to be idempotent. Leave a plan pin unchanged when its computed fingerprint is unchanged. A reviewed shared input may legitimately change multiple computed fingerprints; migrate only those entries through tracked refactor-equivalent proof envelopes that preserve the official observation hash, bind portable LF source hashes, and retain immediate-predecessor source ordering."
