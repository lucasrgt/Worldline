narrative.claim=A boat on flowing water is displaced downstream. Two headless protocol-14 peers decode the same Packet23 boat object, then Packet31, Packet33, or Packet34 motion whose quantized pose moves with the current. This is distinct from M154 boat spawn, M378 still-water ride attach/detach, and M403 boat-break drops.
narrative.cycle=DataDrivenCycle rebuilds a raised east-flowing water channel in two fresh official server JVMs. Each run places still-water 9 at the west end, opens a dirt gate so flowing water 8 occupies the interior cell, places boat 333 there, and correlates peer entity-move packets downstream. Headless B173WireClient protocol-14 only. No GUI. No Aero.

