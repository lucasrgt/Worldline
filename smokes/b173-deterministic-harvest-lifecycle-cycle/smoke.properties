narrative.title=official Beta 1.7.3 deterministic non-self-drop harvest lifecycle family
narrative.claim=One public TestKit family executes grass, cobweb, bookshelf, and cake against the unmodified official Beta 1.7.3 server. Four isolated rows prove caller-declared placement items, exact placed state and consumption, two fresh-login boundaries, break to air, deterministic non-self or empty drops, and exact tool state.
narrative.cycle=DataDrivenCycle compiles the placement-item-aware lifecycle factory and four caller-owned cases, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. The package is one historical harvest-semantics subsystem, not sixteen atom-sized milestones.

