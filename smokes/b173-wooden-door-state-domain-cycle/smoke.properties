narrative.claim=One public TestKit scenario exercises the complete wooden-door metadata domain on the unmodified official Beta 1.7.3 server. Four look-derived placements prove lower metadata 0 through 3 and upper metadata 8 through 11; four empty-hand activations prove lower metadata 4 through 7 and upper metadata 12 through 15. A fresh login proves the final open grid persisted.
narrative.cycle=DataDrivenCycle compiles the reusable state-domain TestKit contract, the official-server provider, and one caller-owned wooden-door row. The family runs in a fresh isolated world, freezes canonical per-step evidence, and requires exact inventory consumption, all sixteen declared metadata states, a fresh-login boundary, and provider-owned shutdown.

