narrative.claim=This milestone exposes deterministic Beta 1.7.3 entity route construction as a public TestKit mini-subsystem across open, detour, and sealed terrain.
narrative.cycle=M622 constructs the same three in-memory terrain fixtures against mapped and official Beta 1.7.3 server classes. Each mapped run captures immutable public route observations and delegates endpoint, obstacle-gap, and sealed-ring invariants to PathfindingMatrixFixture, producing canonical equatable evidence. The independent official oracle still records every path node, and two mapped plus two official processes must produce the same canonical trace.
