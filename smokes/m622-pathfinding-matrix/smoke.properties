narrative.claim=This milestone freezes deterministic Beta 1.7.3 entity route construction across open, detour, and sealed terrain.
narrative.cycle=M622 constructs the same three in-memory terrain fixtures against mapped and official Beta 1.7.3 server classes. Each run requests an EntityPig route to the same coordinate and records every path node. Open terrain must remain direct, the wall fixture must route through its gap, and the sealed target must stop outside its two-block-high ring. Two mapped and two official processes must produce the same canonical trace.
