narrative.title=minecart derail set
narrative.claim=M580 opens the official minecart-derail boundary. A moving minecart item 328 that leaves the end of regular rail 66 derails onto wooden plate 72. Unpowered powered-rail 27 holds the cart idle so the plate stays 72:0; torch 76 then writes 27:8 and the cart leaves 66 onto 72:1. This is distinct from M155 spawn-only Packet23 type 10 and from M377 powered-rail launch onto detector 28. Headless B173WireClient protocol-14 only. No GUI. No Aero.
narrative.cycle=DataDrivenCycle rebuilds the dead-end rail in two fresh official server JVMs. Each run places powered rail 27, regular rail 66, wooden plate 72, and a south bumper, spawns Packet23 type 10 on unpowered 27, proves plate 72:0 while idle, then powers 27:8 so the cart derails onto 72:1. WorldlineSmokeAwait observes the idle window and awaits the plate. One official EOF is retried after a 5 second sleep. Canonical evidence uses two official server JVMs and four client sessions. Headless protocol-14 only. No GUI. No Aero.
