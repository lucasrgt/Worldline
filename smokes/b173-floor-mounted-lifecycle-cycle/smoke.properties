narrative.title=official Beta 1.7.3 floor-mounted block lifecycle family
narrative.claim=One public TestKit family executes wood and cobblestone stairs, pumpkin, jack-o-lantern, torch, and lit redstone torch against the unmodified official Beta 1.7.3 server. Six isolated rows prove exact floor-placement metadata, two fresh-login boundaries, break to air, the exact historical harvest drop, and exact post-break tool state.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle-family harness and six caller-owned rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Orientation domains, redstone activation, support removal, lighting propagation, and native rendering remain independently proved or outside this lifecycle family.

