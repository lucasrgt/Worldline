narrative.title=Aero culling visual integrity
narrative.claim=Two fresh counterbalanced sessions toggle Aero broad conservative cone culling disabled and enabled within the same client state while keeping the unsafe strict block-entity layer disabled, requiring exact phase-matched pixels over twelve frozen-world camera checkpoints and lower at-rest render work in both sessions.
narrative.cycle=M778 restores one 120-model four-panel scene inside a static opaque enclosure per session, prewarms the shared static model, freezes world ticks, time, weather, entities, clouds, HUD, and tick delta, alternates off/on order within each client, holds eight central and four near-panel views for twenty frames each, compares matching temporal phases across opposite-order sessions, then evaluates every RGBA pixel plus per-frame Aero draw-work and view-cull counters.
