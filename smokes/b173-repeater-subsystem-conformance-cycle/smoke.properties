narrative.schema=1
narrative.title=official Beta 1.7.3 repeater subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps the idle and active repeater blocks as one timed signal component. It proves every orientation and delay metadata state, signal-only active-state materialization, active lifecycle and item drops, chunk-NBT persistence, the shared collision envelope, distinct light emission, exact scheduled delays, and neighbor-driven power, release, and support invalidation.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica materializes all thirty-two idle and active states, observes the two-, four-, six-, and eight-tick transition ladder in both directions, breaks and reloads active state, measures collision and light tables, holds powered and unpowered states through a telemetered window, and removes active support through RepeaterSubsystemFixture.
