narrative.title=official Beta 1.7.3 mob-spawner subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps mob-spawner block 52 across the block, ItemBlock, and TileEntityMobSpawner registries. It proves native item placement and default Pig delay, finite removal with no item drop, Zombie EntityId plus Delay chunk-NBT recovery, an unscheduled block with a range-gated tile tick, and stable ordinary neighbor notifications. Existing physical envelopes, native rendering, spawned-mob identities, spawn geometry, and randomized delay reset evidence remain independently owned and are not count-farmed here.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica inspects all three registry surfaces, places item 52 through the native ItemBlock route, applies the server harvest sequence, reloads Zombie delay 37 through native chunk NBT, contrasts an out-of-range stable delay with one nearby-player decrement, and applies stone and lever neighbor notifications through MobSpawnerSubsystemFixture.
