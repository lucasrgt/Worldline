narrative.title=double chest merge
narrative.claim=Two adjacent chests form a large chest with a shared 54-slot Packet100 window. A lone chest first opens as title Chest with 27 owned slots; placing one adjacent chest merges that window to title Large chest with 54 owned slots. This is distinct from M232 single-chest place and orientation, which never opens Packet100.
narrative.cycle=DataDrivenCycle rebuilds the raised two-block stone pad in two fresh official server JVMs. Each run places one chest, opens Packet100 title Chest with 27 owned slots, places an adjacent chest, then opens Packet100 title Large chest with 54 owned slots. Fresh login keeps the merged 54-slot window. Headless B173WireClient protocol-14 only. No GUI. No Aero.
