narrative.schema=1
narrative.title=official Beta 1.7.3 built-environment material subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps fourteen construction and navigation materials across forty-seven unresolved archetype claims: six metadata domains, seven native collision envelopes, eight light-table pairs, thirteen tick policies, and thirteen neighbor responses. Existing registry, placement, lifecycle, drops, persistence, rendering, and previously qualified physical dimensions remain independently owned and are not counted here.
narrative.cycle=Run executes two fresh mapped worlds and two untouched official-server worlds. Every replica installs the same fourteen-block material row, enumerates applicable metadata, measures full, wall-thin, and two-box stair collision, inspects opacity and emission tables, runs each claimed native update, applies deterministic neighbor changes, and removes the ladder support through BuiltEnvironmentMaterialsFixture.
