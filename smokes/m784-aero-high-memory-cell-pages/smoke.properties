narrative.schema=1
narrative.title=Aero high-memory flattened Cell Page qualification
narrative.claim=Eight fresh clients in four counterbalanced pairs classify Aero high-memory flattened Cell Pages against normal memory defaults in a restored four-chunk 576-machine scene, requiring visual equivalence, stable page caches, bounded display-list guardrails, no hitch regression, and material frame and flush improvements before promotion as a production opt-in.
narrative.cycle=M784 prepares one deterministic four-tower save, then loads it in four counterbalanced normal/high pairs. Every arm warms the complete camera route before measuring at least 1,200 frames and 20 seconds through orbit, traversal, fast spin, teleport and close inspection. The visual boundary clears unrelated terrain and submits all 576 fixtures through the production Cell Page queue with fixed membership, fixed brightness and a shared minimum page size of one. It captures 24 full RGBA frames, classifies same-arm raster noise, and measures complete frame time, p99, thread allocation, heap high-water mark, Cell Page flush time, page compilation and cache stability, display-list limits and prewarm drainage. The result deterministically says promote-opt-in or keep-candidate; it never enables high-memory mode by default.
