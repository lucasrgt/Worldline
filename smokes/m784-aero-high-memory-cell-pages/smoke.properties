narrative.title=Aero safe high-memory Cell Page qualification
narrative.claim=Eight fresh clients in four counterbalanced pairs classify Aero's corrected high-memory Cell Page preset against normal memory defaults in a restored four-chunk 576-machine scene, requiring flattening to remain disabled, visual equivalence, stable page caches, bounded display-list guardrails, both order strata, three frame-winning pairs, no hitch regression, and material frame and flush improvements before promotion as a production opt-in.
narrative.cycle=M784 prepares one deterministic four-tower save, then loads it in four counterbalanced normal/high pairs. Every arm warms the complete camera route before measuring at least 1,200 frames and 20 seconds through orbit, traversal, fast spin, teleport and close inspection. The visual boundary clears unrelated terrain color and depth and suppresses native dispatcher submission for only the fixture machines. A fixed frame-tail boundary submits all 576 fixtures through the production Cell Page queue with fixed membership, fixed brightness and a shared minimum page size of one, suppresses automatic fixture-time flushes, then performs exactly one controlled production flush and records both its isolated cost and Aero profiler totals. It captures 24 full RGBA frames at route-bound checkpoints, retries at most one route of blank framebuffer reads, classifies same-arm raster noise, and measures complete frame time, p99, thread allocation, heap high-water mark, page compilation and cache stability, display-list limits and prewarm drainage. Promotion requires the aggregate thresholds, both counterbalanced order strata and at least three frame-winning pairs. The result deterministically says promote-opt-in or keep-candidate; it never enables high-memory mode by default.
