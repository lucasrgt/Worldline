narrative.schema=1
narrative.title=Aero chunk scheduler lifecycle soak
narrative.claim=An independent external consumer builds the pinned StationAPI artifact and proves across two fresh Java 8 JVMs that one-rebuild scheduling drains 164096 work items, bounds hidden work to 157 frames under sustained visible arrivals, and clears pending state, queue identity, invocation, and metrics on every one of 256 world transitions.
narrative.cycle=The cycle hashes the scheduler, platform budget, lifecycle Mixin, and external probe; runs StationAPI remapJar; compiles the exact core scheduler with javac release 8; then repeats a 256-epoch deterministic soak in two fresh JVMs. Each epoch admits 128 hidden chunks plus 512 visible arrivals, drains completely under budget one, seeds sixteen pending chunks, calls production reset, and inspects the scheduler state fail-closed. It does not launch Minecraft or claim GPU performance.
