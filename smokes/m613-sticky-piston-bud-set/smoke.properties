narrative.title=sticky piston BUD set
narrative.claim=M613 opens the official sticky-piston BUD boundary. A diagonal-above lever QC-primes west sticky piston 29 without extending. A north stone neighbor update then extends 29:4 to 29:12 with head 34:12 while south stays air and no live direct power is present. Unpower leaves the arm latched or a second neighbor update pulls. Distinct from M547 immediate sticky QC and M548 regular-piston BUD. No south-power fallback.
narrative.cycle=DataDrivenCycle rebuilds the cloned sticky-29 BUD arm in two fresh official server JVMs. Each run primes the diagonal-above lever without extending, places a north stone update, observes BUD extend plus pull, and reloads the final arm after save plus fresh login. The frozen signal includes bud-extend, primed=29:4, direct-power=false, and south air. Headless protocol-14 only. No GUI. No Aero.
