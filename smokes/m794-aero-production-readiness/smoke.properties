narrative.title=Aero production readiness matrix
narrative.claim=Qualify exact multi-pose reuse and the default renderer against the immutable previous implementation across twelve production cases.
narrative.cycle=Native chunk snapshots are collected after timing at the three traversal captures; a failed exact oracle stops before further clients. Controlled fixture inputs seed each active Arsenic water/lava binder with 173 after texture-pack reload and freeze it after exactly 32 native updates. Every arm waits at its initial camera with models canceled until all 2312 native chunks are compiled and eight complete RGBA frames match. Terrain preparation is outside timing; initial model and animation cold work is preserved. Vanilla distance comparison is unchanged. Independent baseline clients must match each other exactly. Per-frame CPU, GC and JIT diagnostics never exclude frames or relax wall-time thresholds. Every client renders into a private RGBA8/depth24 framebuffer with the original depth precision; the default window back buffer is not the capture oracle. Entirely zero-alpha or constant frames fail; translucent native geometry may have non-opaque alpha. Advanced OpenGL terrain queries and Aero spike logging are disabled in both arms to remove asynchronous terrain-query history and logging overhead from the animation contract. Each arm resets the native previous-camera sort sentinel and restores initial chunk-array ordering so the same trajectory has the same predecessor state. Eight fresh StationAPI clients run baseline-current-current-baseline version groups, each with off-on and on-off arms. The immutable baseline is 88adc8e6e219b2381766303dbaa4c26ee5c2199d. Cases cover first render, 1/20/64/128/256 exact phases, a 400-tick transition, custom playback, nested skeleton, model identity replacement, block and lighting changes, and chunk-boundary traversal with teleport reveal. Five terrain-only views wait for zero dirty chunks across the complete native ring and eight identical complete-frame samples spaced fifteen rendered frames apart. Model submission stays canceled. A separate diagnostic client attributes inclusive CPU time in pose resolution, cached local transforms, cached packing, unique transform-and-pack, and Tessellator driver calls; these injected hooks are absent from all eight qualification clients. Each case runs 180 frames per arm and records 120 after discarding 60, except first-render profiles retain all 180. Cold comparisons use only the first arm of fresh JVMs against the corresponding baseline version and order. Three complete RGBA captures per case and arm must match exactly, including current-off versus historical-off. Each version/order stratum requires mean render ratio at most 1.03, p99 at most 1.05, allocation at most 1.02 and non-increasing 50ms hitches. The 20- and 64-phase candidate cases additionally require at least ten percent mean render reduction in both orders. Saturation, transitions, custom playback and nested skeletons must not produce candidate matches. Changed lighting must rebuild real Cell Pages. Staging remains bounded at 16 MiB. All original Worldline Profiler artifacts and framebuffer bytes are retained. Timing excludes display, readback and fixture preparation; no all-platform or end-to-end latency claim is made.

