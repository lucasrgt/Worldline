narrative.schema=1
narrative.title=Aero production readiness matrix
narrative.claim=Qualify exact multi-pose reuse and the default renderer against the immutable previous implementation across twelve production cases.
narrative.cycle=A registered chunk-baked showcase block is present in every exact-frame scene. After allocation preflight capture completes, native probes compare vanilla and null dispatch behavior and require successful registered meshes to return true and failed registered meshes to return false. Two separate allocation diagnostic clients first run the historical and current default-off renderers with Java Flight Recorder allocation events and stack traces. Their twelve scenes and complete captures are checked, but their profiles never enter the performance matrix. Recordings are required and retained for attribution. The following twelve qualification clients do not enable Flight Recorder. The fixture registers a direct consumer renderer once through the StationAPI renderer event and adjusts brightness through a primitive return value; no cancellable callback is allocated for each model or brightness sample. Before world loading, every client verifies Windows High priority and affinity to one permitted logical processor on each of four distinct physical cores, with JVM ActiveProcessorCount fixed at four. This scheduling profile applies to the benchmark process for its lifetime and is an explicit host qualification condition. After timing and capture, each client presents its private framebuffer in the native window and updates the title with case progress; an unavailable blit extension clears stale loading-screen contents. Native chunk snapshots are collected after timing at the three traversal captures; a failed exact oracle stops before further clients. Controlled fixture inputs seed each active Arsenic water/lava binder with 173 after texture-pack reload and freeze it after exactly 32 native updates. Every case waits at its initial camera with models canceled until all 2312 native chunks are compiled and eight complete RGBA frames match. Terrain preparation is outside timing; initial model and animation cold work is preserved. Vanilla distance comparison is unchanged. Independent baseline clients must match each other exactly. Per-frame CPU, GC and JIT diagnostics never exclude frames or relax wall-time thresholds. Every client renders into a private RGBA8/depth24 framebuffer with the original depth precision; the default window back buffer is not the capture oracle. Entirely zero-alpha or constant frames fail; translucent native geometry may have non-opaque alpha. Advanced OpenGL terrain queries and Aero spike logging are disabled in both arms to remove asynchronous terrain-query history and logging overhead from the animation contract. Each case resets the native previous-camera sort sentinel and restores initial chunk-array ordering so the same trajectory has the same predecessor state. Twelve fresh StationAPI clients run four triplets: baseline-off/current-off/current-on, then its reverse twice, then the initial order. Each process fixes the actual aero.multiPoseReuse property once at startup. No mixin intercepts enabled() and no mode changes within a JVM. The immutable baseline is 88adc8e6e219b2381766303dbaa4c26ee5c2199d. Cases cover first render, 1/20/64/128/256 exact phases, a 400-tick transition, custom playback, nested skeleton, model identity replacement, block and lighting changes, and chunk-boundary traversal with teleport reveal. Five terrain-only views wait for zero dirty chunks across the complete native ring and eight identical complete-frame samples spaced fifteen rendered frames apart. Model submission stays canceled. A separate diagnostic client attributes inclusive CPU time in pose resolution, cached local transforms, cached packing, unique transform-and-pack, and Tessellator driver calls; these injected hooks are absent from all twelve qualification clients. The first case retains all 180 cold render frames in every fresh JVM. Each subsequent case first warms 300 model frames at its initial fixed camera, resets its controlled playback and model identity, then runs 180 frames and records 120 after discarding 60. Terrain remains settled before timing. No observations are removed after collection. Three complete RGBA captures per case must match the first historical-off client exactly across all twelve clients, including both current modes. Each order stratum contains two independent replicates of all three versions/modes. Each version/order stratum requires mean render ratio at most 1.03, p99 at most 1.05, allocation at most 1.02 and non-increasing 50ms hitches. The 20- and 64-phase candidate cases additionally require at least ten percent mean render reduction in both orders. Both 128- and 256-phase saturation, transitions, custom playback and nested skeletons must not produce candidate matches. Changed lighting must rebuild real Cell Pages. Staging remains bounded at 16 MiB. All original Worldline Profiler artifacts and framebuffer bytes are retained. Timing excludes display, readback and fixture preparation; no all-platform or end-to-end latency claim is made.

