narrative.claim=Diagnose differing execution times of identical current-off renderer code using selected C2 instruction bytes without JFR. This acquisition cannot establish production readiness.
narrative.cycle=Six independent current-off clients use the identical Aero 2b7726e checkout and copied world. All twelve scenes, 36 complete exact captures per client, native dispatch observations and every retained profiler frame are required. Same-source image and dispatch comparisons remain exact. JFR is not started: no execution sampling, allocation recording or JFR compilation recording is enabled. The runner rejects JFR files and recording startup signals. HotSpot LogCompilation XML and selected Aero-only compiled instruction output are required. No force-inline, compile-only, optimization or background-compilation settings change. GPU drain stays disabled and its recorded duration must be zero. UTC calibration records the minimum-span startup midpoint; calibration halfspan is not an OS precision or later drift bound, and calibration does not provide sampled attribution in this branch. The pre-existing production matrix and all 48 performance guards remain unchanged and unreachable in this acquisition-only branch. Completion writes diagnostic-disposition.txt and deliberately throws a non-qualification result. No diagnostic duration can supply a production gain or PASS receipt.

