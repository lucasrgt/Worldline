narrative.claim=An unpowered powered-rail stops a moving minecart. This is distinct from M184 unpowered powered-rail placement and from M377 powered-rail acceleration onto a detector.
narrative.cycle=DataDrivenCycle runs PoweredRailBrakeSetSmoke twice on the official b1.7.3 server. Packet15 places a north-walled launch rail 27, a mid rail 27, and a beyond detector 28. Minecart 328 launches when floor torch 76 powers both rails. Breaking the torch unpowers those rails; the moving cart stops and the beyond detector stays 28:0. Fresh login keeps the unpowered rails and idle detector. Headless protocol-14 B173WireClient only. No GUI. No Aero.
