narrative.schema=1
narrative.title=powered rail slope propagation
narrative.claim=M702 opens the official powered-rail power-propagation slope boundary. A redstone torch at the base of a sloped powered rail 27 writes the powered bit on the slope itself and propagates it uphill across the slope boundary to the higher flat rail and downhill to two lower flat rails; breaking the torch restores every rail to its idle shape. This is distinct from flat-line rail power states (M309), powered acceleration (M377), unpowered braking (M595), and slope geometry placement only (M432).
narrative.cycle=DataDrivenCycle rebuilds the raised north-south slope run in two fresh official server JVMs. Each run places powered rails 27 as low, far, top-of-slope-support, then the sloped cell, verifies every idle shape, places torch item 76 east of the slope base, observes bit 8 on all four rails across the boundary, holds the powered state, breaks the torch, observes full unpower restoration, then reloads every cell after save plus fresh login. Headless protocol-14 only. No GUI. No Aero.
