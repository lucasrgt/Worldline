narrative.title=fire spread wood set
narrative.claim=M606 qualifies official fire spread from a burning source onto adjacent flammable planks 5 and wood 17 as one SET. Packet15 of flint-and-steel item 259 ignites netherrack 87 under a stone sky cover. Official random ticks then emit Packet53 fire 51 in an air cell above the wood ring. The source fire remains 51. The frozen signal names spread=air->51, cover=4:76:4:1:0, and source-stay=true. Netherrack fire persists across a clean save plus fresh login. This family is distinct from shipping M268 flint-and-steel place and M515 fire-support extinguish. It does not claim rain extinguishing, leaves, wool, or a generic fire-propagation model. Headless B173WireClient protocol-14 only. No GUI. No Aero. Exact wait length and which wood-adjacent air cell ignites are not hashed.
narrative.cycle=DataDrivenCycle rebuilds the raised covered netherrack-plus-wood pad in two fresh official server JVMs. Each run Packet15-ignites netherrack 87, then waits a bounded random-tick window until Packet53 fire 51 appears in air adjacent to planks 5 or wood 17. One official EOF is retried after a 5 second sleep. Canonical evidence uses two official server JVMs and four client sessions. Headless protocol-14 only. No GUI. No Aero. Qualify it with java tools/harness/Gate.java --milestone m606-fire-spread-wood-set.
