narrative.schema=1
narrative.title=portal re-entry cooldown
narrative.claim=Official Beta 1.7.3 suppresses an immediate return while a player remains in the generated arrival portal. After an Overworld-to-Nether transition, another full 120-tick portal-contact observation leaves the same player inside the collision region in dimension minus one. A server-corrected trajectory then proves that player left the portal for a bounded 220-tick window and re-entered it before a 120-tick residence produced Packet9 back to dimension zero. Both generated sides retain six portal blocks within fourteen obsidian blocks, and the returned dimension persists. This contract does not claim the minimum release duration, dynamic portal coordinates, coordinate scaling, non-player entities, or portal construction limits.
narrative.cycle=DataDrivenCycle rebuilds two fresh official dedicated-server replicas. A protocol-14 player constructs and activates the already-qualified upright fourteen-obsidian source portal, remains in it for the outbound residence window, and discovers the generated Nether portal by its six-cell geometry. The blocked treatment confirms the same player's corrected pose remains inside the destination collision region after 120 ticks. The control records that player outside the collision region at the end of exactly 220 observed ticks, then records the same player inside again before the return residence. Packet9 dimensions, the inside-outside-inside path, portal geometry, and saved player dimension flow through PortalReentryCooldownFixture as equatable evidence. Headless only. No GUI. No Aero.
