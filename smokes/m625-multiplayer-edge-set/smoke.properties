narrative.claim=This milestone freezes bounded multiplayer ordering, isolated disconnect, same-user reconnect, and pose persistence across server restart.
narrative.cycle=M625 runs two official dedicated-server boots. Alpha then Beta connect on the first boot; Alpha moves, disconnects while Beta remains, and reconnects with a fresh entity identity at the persisted pose. After a clean save and restart, Beta then Alpha connect in reverse order and Alpha must resume the same persisted pose. Two fresh official cycles must emit the same evidence.
