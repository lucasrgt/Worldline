narrative.claim=One public TestKit family executes ladder, wall sign, lever, and stone button against the east face of stone on the unmodified official Beta 1.7.3 server. Four isolated rows prove exact side-placement metadata, placement-item consumption including the sign item-to-block transition, two fresh-login boundaries, break to air, exact historical drops, and unchanged zero-hardness tools.
narrative.cycle=DataDrivenCycle compiles the reusable arbitrary-face lifecycle factory, official provider, and four caller-owned rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Orientation domains, activation, support-removal reactions, sign text, and native rendering remain independent behavior families.

