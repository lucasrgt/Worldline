narrative.title=official Beta 1.7.3 shear-harvested leaf-variant lifecycle family
narrative.claim=One public TestKit family executes log-supported oak, spruce, and birch leaf variants against the unmodified official Beta 1.7.3 server. Three isolated rows prove placement-item consumption, exact persistent metadata, two fresh-login boundaries, break to air, variant-preserving shear drops, one durability point, and stable natural support.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle provider and three caller-owned leaf rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Item variants 18:0, 18:1, and 18:2 must place states 18:8, 18:9, and 18:10 beside a log and shear back to their original item variants. Natural growth, unsupported leaf decay, tall-grass harvest, crop support transitions, and native rendering remain independent behavior families.

