narrative.title=official Beta 1.7.3 shear-harvested foliage lifecycle family
narrative.claim=One public TestKit family executes placed leaves and tall grass against the unmodified official Beta 1.7.3 server. Two isolated rows prove placement-item consumption, exact historical placed variants, two fresh-login boundaries, break to air, exact shear drops, one durability point, and stable support.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle provider and two caller-owned foliage rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. The tall-grass row freezes the Beta ItemBlock behavior where carried variant 31:1 places state 31:0. Natural growth, leaf decay, dead-bush harvest, crop support transitions, and native rendering remain independent behavior families.

