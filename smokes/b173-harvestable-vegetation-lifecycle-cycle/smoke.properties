narrative.title=official Beta 1.7.3 harvestable vegetation lifecycle family
narrative.claim=One public TestKit family executes placed leaves, tall grass, dead bush, and age-zero crops against the unmodified official Beta 1.7.3 server. Four isolated rows prove placement-item consumption, exact placed variants, two fresh-login boundaries, break to air, exact historical shear or seed drops, exact tool state, and stable environmental support.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle provider and four caller-owned vegetation rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Leaves, tall grass, and dead bush use shears; crops use seeds on hydrated farmland beside protocol-provisioned still water. Natural growth, decay, seed probability beyond age zero, hydration transitions, and native rendering remain independent behavior families.

