narrative.schema=1
narrative.title=minecart booster bug
narrative.claim=M628 freezes the classic Beta 1.7.3 side-by-side minecart booster. Two empty minecarts start at the same longitudinal coordinate on adjacent parallel regular rails 66. Packet7 attacks only the driver cart toward the south; both the attacked driver and the untouched parallel cart then move south. The TestKit contract requires distinct type-10 carts, a one-block lateral gap, and forward movement for both. This does not claim powered-rail speed, furnace-cart propulsion, riding, derailment, or arbitrary cart collisions.
narrative.cycle=DataDrivenCycle rebuilds the raised parallel-track fixture in two fresh official dedicated-server JVMs. Each replica places two minecart items 328 behind north walls, emits one Packet7 attack against only the driver, and observes protocol-14 Packet31, Packet33, or Packet34 forward movement for both entities. MinecartBoosterFixture normalizes unstable entity IDs and movement packet choice into equatable forward-motion evidence. Headless B173WireClient only. No GUI. No Aero.
