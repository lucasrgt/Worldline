narrative.cycle=M623 compares mapped and official server lighting over open, roofed, and aperture terrain. It then replaces one source through glowstone, active furnace, glowing redstone ore, active redstone torch, and air while recording attenuation. Finally it closes and reopens a skylight aperture and requires exact recovery. Two mapped and two official processes must produce the same canonical trace.
