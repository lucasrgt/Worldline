narrative.claim=One public TestKit family executes tall grass on dirt, dead bush on sand, and age-zero wheat from seeds on protocol-provisioned farmland against the unmodified official Beta 1.7.3 server. Three isolated rows prove legal substrates, item consumption, placed state, two fresh-login boundaries, break to air, official drop identity within historical bounds, and unchanged zero-hardness tools.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle provider and three caller-owned ground-cover rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Farmland is admin substrate setup rather than a hoe-tilling claim. Crop growth, bonemeal, worldgen tall grass, and flora physical envelopes remain independent behavior families.

