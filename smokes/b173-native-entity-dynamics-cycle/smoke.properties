narrative.title=native entity movement, environment and timed-state contrasts
narrative.claim=This package declares a reusable native-entity-dynamics behavior over the 23 concrete persistent entity registrations. Movement cases compare native displacement with and without a wall; the hanging painting compares zero movement with a nonzero break-and-drop action. Environment cases use actual onUpdate dispatch in dry/wet worlds or compare native support arrest, sand settlement and rail drag. Timed cases compare active and inactive cooldowns or neighboring item/projectile expiry and painting support-check ages. Constructor and field assignments establish preconditions; they are never counted as observed transitions. Existing stronger gameplay proofs remain independently bound.
narrative.cycle=The shared NativeInventoryRenderCycle entry point runs NativeDifferentialCapture with two mapped-server and two untouched official-server processes. Original memory storage facades return native World and Chunk objects; original setup resolves only existing hash-pinned Tiny names and checks exact native registry classes. NativeEntityDynamicsFixture rejects missing controls, wrong routes, unconstrained displacement and fabricated expiry. Qualification requires all 66 paired cases and byte-identical equatable observations across all four processes. This bounded kernel capability does not claim exhaustive AI navigation, full entity lifecycles, damage immunity, drops, world saves or protocol materialization. Immersion compares the native eye-material query and the following native tick: chicken and snowball retain a false inWater flag despite submerged eyes. Cooldown worlds have a solid roof to exclude daylight damage. These bounded observations do not claim land-caused squid death. The frozen signature records the four independent captures.
