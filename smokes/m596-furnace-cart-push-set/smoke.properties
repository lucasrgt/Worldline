narrative.claim=A fueled furnace minecart consumes coal 263 and self-propels south on regular rail 66. Packet15 of furnace-minecart item 343 is observed as Packet23 type 10, 11, or 12 from the official oracle, not assumed. An unfueled hold stays idle; Packet7 of coal then consumes the stack and Packet28 carries a southward velocity. This is distinct from M257 spawn-only type 12 and from M424 detector occupancy 28:0->8. Headless B173WireClient protocol-14 only. No GUI. No Aero.
narrative.cycle=DataDrivenCycle rebuilds the raised stone track in two fresh official server JVMs. Each run places rail 66, furnace-minecart 343, and coal 263. The oracle object type is recorded from Packet23, coal 263 is consumed, and Packet28 proves south self-propulsion on rail 66 without detector 28 or powered rail 27. One official EOF is retried after a 5 second sleep. Canonical evidence uses two official server JVMs and four client sessions. Headless protocol-14 only. No GUI. No Aero.
