narrative.claim=One public TestKit mini-subsystem exercises moving water and moving lava inside the official native scheduler. It proves the complete water metadata domain, the Overworld lava even-metadata domain, exact first-flow cadence, neighbor-driven still-to-moving recomputation, passable collision, native light transport, and exact moving-state chunk reloads.
