narrative.claim=One public TestKit mini-subsystem captures the canonical width, height, vertical offset, derived AABB, collidable and pushable dispositions, and pair-collision-box behavior of every concrete EntityList subject. The abstract registered EntityLiving class remains an explicit non-applicable boundary instead of being fabricated as a runtime instance.
narrative.cycle=EntityPhysicalEnvelopeCycle executes two fresh mapped official-client captures. Each pass initializes the native registries, constructs all twenty-three concrete registry classes with canonical state, normalizes the otherwise random slime size, positions every entity at the same coordinate, validates its exact AABB derivation, records contact dispositions, and requires byte-identical public evidence across both passes.

