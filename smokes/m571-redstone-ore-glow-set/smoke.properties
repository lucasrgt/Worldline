narrative.claim=Stepping on or clicking placed redstone ore lights unlit 73:0 to glowing 74:0, then official random ticks darken it back to 73:0. This is distinct from M229 unlit placement persistence and M511-SW controlled trigger membership.
narrative.cycle=DataDrivenCycle rebuilds the raised-stone east-floor ore in two fresh official server JVMs. Each run places redstone ore 73, empty-hand Packet15 lights it to 74, waits official random ticks, then a fresh login proves darkened 73:0. Walking onto that cell lights it again; a second save plus login proves the later darken. Headless protocol-14 B173WireClient only. No GUI. No Aero.
