narrative.title=armor durability hit
narrative.claim=Worn armor loses durability after a hostile melee hit. An NBT-seated iron chestplate 307 in window-0 slot 6 starts at damage 0. One Packet24 type-54 zombie melee at Normal difficulty 2 produces Packet8 and Packet103 that raise that damage. This is distinct from armor-reduction (M451), equip-only window proofs (M270-M273), crafts, and PvP Packet7 (M66).
narrative.cycle=DataDrivenCycle rebuilds the raised grass platform in two fresh official server JVMs. Each run places one default spawner 52, retargets EntityId to Zombie, seats iron chestplate 307 through player NBT slot 102, and records Packet103 slot-6 damage after one type-54 melee. One official EOF is retried after a 5 second sleep. Headless B173WireClient protocol-14 is the only client. There is no GUI and no Aero path.
