narrative.title=official Beta 1.7.3 native tile-entity render family
narrative.claim=This milestone closes the native-render Functional Census boundary for all three registered render-type -1 blocks: moving piston, standing sign, and wall sign. Each canonical state binds its official tile renderer to a textured nonempty RGBA frame and reusable public TestKit evidence, completing the registered block rendering matrix.
narrative.cycle=NativeInventoryRenderCycle loads the hash-pinned official terrain and sign textures and executes four fresh Pbuffer processes: mapped A and B, then official A and B. Signs receive minimal concrete chunk-backed worlds while moving piston receives its native stored-block state and RenderBlocks access. Qualification requires repeat equality, mapped-official equality, exact renderer provenance, nonzero geometry, and the frozen family signature.
