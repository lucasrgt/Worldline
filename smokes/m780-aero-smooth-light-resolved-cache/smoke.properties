narrative.schema=1
narrative.title=Aero resolved smooth-light cache
narrative.claim=Four fresh JVMs in ABBA order require Aero's resolved smooth-light cache at its 50 ms default TTL to preserve every observed framebuffer pixel outside independently measured same-arm raster noise before and after a real brightness-field change, refresh stale entries after the documented TTL, reduce world-light sampling and render time in both rounds, and add no material hitch regression.
narrative.cycle=M780 restores the same frozen 128-MegaCrusher multi-chunk world into four fresh clients ordered cache-off, cache-on, cache-on, cache-off. Each client pre-traverses 480 unmeasured frames, then executes a deterministic 240-frame orbit, traversal, spin, teleport, and close inspection. A scoped synthetic world-light grid drives the production smooth-light renderer without changing unrelated terrain lighting. At the midpoint the grid changes while the camera is held fixed; before and after diagnostics bracket a 100 ms convergence window, exercising the cache's 50 ms stale-entry path. The cycle captures 24 route frames plus both light diagnostics, derives raster noise only from off/off and on/on repeats, forbids unexplained off/on pixels, and records render calls, world-light samples, native hit/miss reason counters, LRU state, render duration, and 50 ms hitches.
