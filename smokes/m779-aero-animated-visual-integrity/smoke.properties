narrative.schema=1
narrative.title=Aero animated visual integrity
narrative.claim=Four fresh JVMs in ABBA order require Aero broad conservative cone culling, fixed immutably at process startup, to introduce no framebuffer difference outside the independently observed same-arm raster noise across deterministic keyframed animation, morph deformation, player-targeted IK, and production animated-to-at-rest LOD transitions while preserving repeatable same-arm work and reducing animated work and render time in both rounds.
narrative.cycle=M779 restores the same frozen 120-model world into four fresh clients ordered cull-off, cull-on, cull-on, cull-off. Each client pre-traverses the complete route five times for 1,200 unmeasured frames under its immutable arm. The pinned Aero runtime orders equal-state animated batches by stable model resource name, uses each model's visual-radius sphere at the broad-cone boundary, collapses previous/current camera interpolation at every moving sample, seeks all keyframed, morph, and IK models to spatially varied deterministic poses on each of 240 measured route frames, crosses production animation LOD during orbit, walk, fast-spin, teleport, and near-panel movement, and captures 24 full RGBA frames. The differential oracle builds a noise mask from off/off and on/on repeats, limits each pair and the union mask to 10 changed locations per million observed pixels, forbids every off/on change outside that independent mask, requires animated, at-rest, and list-call work to repeat exactly within each arm, and records render duration and 50 ms hitches.
