narrative.title=repeater diode set
narrative.claim=M570 opens the official Beta 1.7.3 repeater diode. A west-facing repeater conducts a lever pulse from its input dust to its output dust while the reverse lever on the output path leaves the repeater unpowered and does not power the input side. This is distinct from M170 place/power and M341 delay-tune.
narrative.cycle=DataDrivenCycle executes RepeaterDiodeSetSmoke twice on fresh official server JVMs. Each run places a west-facing repeater between input and output dust, proves reverse-lever isolation, then proves forward conduction, and reloads the powered diode after save plus fresh login. Headless protocol-14 only. No GUI. No Aero.
