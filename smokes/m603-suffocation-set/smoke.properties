narrative.claim=M603 opens the official head-in-solid suffocation SET. Falling sand 12 on the standing actor's head cell deals Packet8 20->19 with Packet38 status 2. Health stays 19. This is distinct from M465 lava+drown+suffocate death to 0 and from M307's compound drown+suffocate+lava hurt. Dirt and other normal cubes share the same in-wall path; this SET oracles sand bury.
narrative.cycle=DataDrivenCycle rebuilds the raised-stone falling-sand head fixture in two fresh official server JVMs. Each run places sand 12 so it falls into the body then head cells, then requires Packet8 20->19 and Packet38 status 2 without death. One official EOF is retried after a 5 second sleep. Canonical evidence uses two official server JVMs and two client sessions. Headless B173WireClient protocol-14 only. No GUI. No Aero.
