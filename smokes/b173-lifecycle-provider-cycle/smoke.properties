narrative.title=official Beta 1.7.3 public block lifecycle provider
narrative.claim=The optional provider executes three isolated public TestKit rows against the unmodified official Beta 1.7.3 server. Cobblestone and dirt route drops through archetypes; empty chest routes through singular evidence. Every row proves placement, fresh-login persistence, break to air, exact drop, tool damage, and a second fresh-login persistence boundary.
narrative.cycle=DataDrivenCycle compiles the Java 8 provider extension and public spec, runs cobblestone, dirt, and empty-chest in three fresh server workspaces, repeats the entire run, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown.

