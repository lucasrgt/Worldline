narrative.title=official Beta 1.7.3 static self-drop lifecycle family
narrative.claim=One independently signed public TestKit family executes sponge, white wool, TNT, fence, and netherrack against the unmodified official Beta 1.7.3 server. Each metadata-zero row proves placement, two fresh-login persistence boundaries, break to air, one exact self drop, and exact post-break tool state. The shears remain undamaged for placed wool; the other tools gain one damage. Sponge and TNT keep singular drop routing; wool, fence, and netherrack route through archetypes.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle-family harness and five caller-owned rows, runs them in fresh official server workspaces, repeats the entire family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Activation, fluid reaction, wool variants, collision geometry, and fire behavior remain outside this lifecycle family.

