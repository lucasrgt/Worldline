narrative.title=official Beta 1.7.3 piston subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps all four native piston blocks as a causal unit. It proves the complete normal and sticky metadata domains, event-only head and moving-state materialization, delegated break and drop behavior, chunk-NBT persistence, native collision and light envelopes, event-driven tick policy, and neighbor-driven extension, retraction, and invalidation.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica materializes all twelve normal and sticky orientations, settles moving tile entities, exercises head and moving-state destruction, round-trips a live moving tile through native chunk NBT, measures collision and light tables, holds idle states across bounded ticks, and applies normal, sticky, unsupported-head, and moving-tile neighbor transitions through PistonSubsystemFixture.
