narrative.claim=EntityStateFixture verifies native fire, lava, fall, drowning and suffocation against controls on pigs and fire-immune pigmen; matched seeded raw/cooked pork and colored/sheared wool death contexts; and target acquisition under visibility, brightness and player-provoked anger. EntityVisualStateFixture verifies independent idle, hurt, walking, empty, shadow-only, fire-only and combined frames for pigs and zombies. These deepen existing Functional Census cells without changing its 1310-cell denominator. Every outcome comes from original native dispatch.
narrative.cycle=Eight fresh JVMs compare mapped A/B and official A/B separately for server gameplay and client rendering. Native provenance, strict public fixture acceptance and complete equatable observations are mandatory. The render capture retains 128x128 raw RGBA and actual GL vendor, renderer and version beside each capture for subsequent cross-device comparison. Qualification here binds the local OpenGL device; two private Windows GPU preference probes both selected NVIDIA RTX 4060, so AMD and cross-GPU portability remain unqualified. This package does not claim exhaustive damage causes, all AI paths, every animation, or world tick integration of the render-only states. No official assets or decompiled sources are distributed.
