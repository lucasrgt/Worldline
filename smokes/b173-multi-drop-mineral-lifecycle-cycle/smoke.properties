narrative.claim=One public TestKit family executes lapis ore, redstone ore, and glowstone against the unmodified official Beta 1.7.3 server. Three isolated rows prove placement and persistence, pickaxe break to air, exact historical multiple-item drop matrices including lapis damage 4, one tool-durability point, and removed-state persistence.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle provider and three caller-owned mineral rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Fortune, silk touch, experience, glowing-redstone state transitions, crafting compression, light propagation, and native rendering remain independent behavior families.

