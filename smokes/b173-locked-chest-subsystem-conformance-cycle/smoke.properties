narrative.title=official Beta 1.7.3 locked-chest subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps locked chest block 95 as a luminous full cube with native ItemBlock placement, instant harvest and one self-drop, direct chunk-NBT persistence, random-tick enrollment, self-removing native tick behavior, and stable ordinary neighbor notifications. The package also corrects the Functional Census taxonomy: BlockLockedChest is not a container and owns no tile entity.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica places a supplied locked-chest item through the native Item route, applies the same strength and harvest operations as the server break manager, identifies the exact dropped stack, reloads native chunk NBT, measures collision and light tables, proves random-tick enrollment and the direct self-removal callback, and applies stone and lever neighbor notifications through LockedChestSubsystemFixture.
