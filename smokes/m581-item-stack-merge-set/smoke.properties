narrative.claim=Two identical Packet21 stone stacks dropped in contact remain two live entities. Official EntityItem does not absorb one stack into the other, so Packet29 destroy and a remaining count increase stay absent. This is distinct from M517 EntityItem age-6000 despawn.
narrative.cycle=DataDrivenCycle rebuilds the two-stone drop in two fresh official server JVMs. Each run Q-drops two 1x1 stone entities while looking down, waits a 30-tick contact window inside the pickup-delay, and requires live=2 with merged=false. Headless B173WireClient protocol-14 only. No GUI. No Aero.
