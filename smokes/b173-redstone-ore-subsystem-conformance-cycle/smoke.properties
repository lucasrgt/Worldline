narrative.schema=1
narrative.title=official Beta 1.7.3 redstone ore subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps inactive redstone ore 73 and glowing redstone ore 74 as one state machine. It proves causal click activation, the glowing lifecycle and bounded dust drop, chunk-NBT persistence of both states, full collision, opacity and emission, random-tick fade, and stable neighbor handling.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica resolves both registry entries, activates 73:0 into 74:0 through the native click path, fades 74:0 through its random-tick callback, breaks a glowing cell, reloads both states through native chunk NBT, measures collision and light tables, and applies stone and lever neighbor notifications through RedstoneOreSubsystemFixture.
