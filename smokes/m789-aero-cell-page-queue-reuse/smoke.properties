narrative.schema=1
narrative.title=Aero bounded Cell Page queue reuse
narrative.claim=Eight fresh clients in four counterbalanced pairs classify bounded transient Cell Page queue reuse against the same ordered-template path with reuse disabled, preserving exact raster output and workload while measuring allocation, frame, render, pool, display-list, and hitch evidence.
narrative.cycle=M789 restores the M788 576-machine four-chunk route, then runs four counterbalanced baseline/reuse pairs in fresh clients. Both arms warm and render the identical ordered Cell Page template path; only aero.becell.queueReuse changes. Each arm measures at least 1,200 frames and 20 seconds after 480 route frames and cache convergence. Twenty-four full RGBA checkpoints per arm prove cross-arm output and same-arm repeatability. The Worldline Profiler hitch gate classifies 50 ms events, while pool counters prove that the enabled arm replaces transient page allocations with bounded reuse after owner references are cleared. The outcome is benefit-confirmed only when allocation falls at least 10% without material FPS, p99, render, hitch, visual, cache, or workload regression.
