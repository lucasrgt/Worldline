narrative.schema=1
narrative.title=official Beta 1.7.3 cake serving lifecycle
narrative.claim=One public TestKit mini-subsystem executes the complete six-serving cake lifecycle on the unmodified official Beta 1.7.3 server. It proves metadata zero through five and final air, three health points per serving, a progressively shrinking collision envelope, exact source light transport, bounded idle stability, fresh-login persistence, and causal removal after its supporting block is broken.
narrative.cycle=DataDrivenCycle runs two fresh official-server replicas through CakeServingFixture. Each replica builds the support and measured collision lane through gameplay actions, places cake item 354, observes every serving state and health transition, samples the same server-authoritative movement and light probes, reloads a partial cake, consumes the sixth serving, places a second cake, breaks its support, and reloads final air.

