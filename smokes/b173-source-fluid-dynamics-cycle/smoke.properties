narrative.claim=One public mini-subsystem exercises still water and still lava through gameplay placement, a causally removed stone gate, bounded official propagation, and fresh-login persistence. Eight claims connect universal placement and reload boundaries to archetype tick and neighbor behavior.
narrative.cycle=DataDrivenCycle runs two isolated official-server worlds through FluidDynamicsFixture. Each row proves exact source-item consumption, a stable source behind a closed gate, stone-to-air-to-flow transition after a player break, bounded flow metadata, and persisted source plus flow after a fresh login.

