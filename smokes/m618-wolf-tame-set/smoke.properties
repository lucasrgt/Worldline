narrative.claim=M618 opens a bounded wild-wolf tame boundary without claiming a deterministic entity RNG draw. Animals are enabled so a default spawner 52 can be retargeted from Pig to Wolf. Packet24 type 95 receives bone item 352 through Packet7 button 0 until Packet38 status 7, with a hard limit of 64 bones. Packet40 tamed bit 2 and persisted Owner NBT must match WolfTame618. This is distinct from M420 dye 351:4, M449 anger, M468 assist, and M583 sit.
narrative.cycle=DataDrivenCycle executes WolfTameSmoke twice on the official b1.7.3 server JAR. Each run rebuilds the raised 7x7 grass platform, places one default spawner, retargets EntityId to Wolf, permits status 6 retries within the 64-bone bound, and requires status 7 plus owner/collar metadata and clean persistence. The frozen evidence records the bound rather than the random attempt number. Headless B173WireClient protocol-14 only. No GUI. No Aero.
