narrative.claim=One public TestKit scenario exercises the complete unlit-furnace facing metadata domain on the unmodified official Beta 1.7.3 server. Four look-derived placements prove metadata 2 through 5, and a fresh login proves the complete facing grid persisted.
narrative.cycle=DataDrivenCycle compiles the reusable state-domain TestKit contract, the official-server provider, and one caller-owned furnace row. The family runs in a fresh isolated world, freezes canonical per-step evidence, and requires exact inventory consumption, all four declared facing states, a fresh-login boundary, and provider-owned shutdown.

