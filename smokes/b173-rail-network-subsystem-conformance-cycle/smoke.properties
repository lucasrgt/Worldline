narrative.title=official Beta 1.7.3 rail-network subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps powered rail 27, detector rail 28, and normal rail 66 across their native metadata domains, flat and ascending selection bounds, empty collision boxes, zero light opacity and emission, stable or twenty-tick policies, detector minecart activation, and support-loss removal with one item drop. Existing registry, placement, lifecycle, persistence, rendering, minecart motion, and downstream powered propagation evidence remain independently owned and are not counted here.
narrative.cycle=Run executes two fresh mapped worlds and two untouched official-server worlds. Every replica enumerates normal and powered metadata domains, measures native flat and ascending bounds including the powered-bit slope quirk, activates and releases a detector rail with a causally verified minecart, checks native collision and light tables, and removes each required support through RailNetworkSubsystemFixture.
