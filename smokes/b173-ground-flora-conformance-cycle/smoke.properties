narrative.schema=1
narrative.title=official Beta 1.7.3 ground-flora conformance subsystem
narrative.claim=One public TestKit mini-subsystem exercises dandelion, rose, tall-grass, and dead-bush on legal dirt or sand through honest reachable state domains, passable collision, native light transport, a 240-tick stability window, causal support invalidation, and persisted final air. Tall-grass state-domain remains explicitly unclaimed because metadata zero is not its complete reachable domain.
narrative.cycle=DataDrivenCycle coordinates four maintained public TestKit families over fifteen fresh official-server worlds. Physical rows place through gameplay and cross fresh-login persistence; support-loss rows place each plant, hold it for 240 ticks, remove the actual dirt or sand support through gameplay breaking, observe both support and target as air, and cross a final fresh login.

