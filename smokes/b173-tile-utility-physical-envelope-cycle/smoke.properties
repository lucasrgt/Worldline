narrative.title=official Beta 1.7.3 tile-utility physical envelopes
narrative.claim=One singular mini-subsystem exercises six tile-backed utility blocks through the public state-domain, collision, and light TestKit families. Per-subject light expectations distinguish five opaque utilities from the skylight-transparent mob spawner. Seventeen executable claims share one official qualification while occupied-jukebox metadata remains explicitly outside the state-domain claim.
narrative.cycle=DataDrivenCycle compiles one caller-owned tile-utility catalog and runs three maintained public TestKit families. Five state rows, six collision rows, and six light rows each own fresh worlds, exact inventory consumption, canonical evidence, and a fresh-login persistence boundary.

