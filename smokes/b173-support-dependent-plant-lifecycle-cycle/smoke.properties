narrative.claim=One public TestKit family executes cactus on sand and sugar cane on dirt beside protocol-provisioned still water against the unmodified official Beta 1.7.3 server. Two isolated rows prove environmental preconditions, item consumption, placed state, two fresh-login boundaries, break to air, exact self-item drops, and unchanged zero-hardness tools.
narrative.cycle=DataDrivenCycle compiles the neighbor-aware lifecycle API, official provider, and two caller-owned plant rows, runs them in fresh server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. This is one support-dependent plant subsystem, not eight atom-sized milestones.

