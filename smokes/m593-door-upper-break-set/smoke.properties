narrative.claim=Breaking the upper half of a closed wooden door removes both door cells and drops wooden-door item 324. This is distinct from wooden-door open/toggle, remaining hinge/face orientation, and iron-door power.
narrative.cycle=DataDrivenCycle rebuilds the raised stone plus wooden-door fixture in two fresh official server JVMs. Each run places wooden door item 324 as BlockDoor 64:0/8, Packet14-breaks the upper half with iron axe 258, requires both cells air plus Packet21 324, and reloads those air cells after save plus fresh login. One official EOF is retried after a 5 second sleep. Headless B173WireClient protocol-14 only. No GUI. No Aero.
