narrative.title=piston push entity set
narrative.claim=M612 opens the official piston-push-entity boundary on protocol-14. A west-facing piston 33 extends into air and displaces a cobble item entity, so fresh-login Packet21 coordinates move west. This is distinct from M142/M367 block motion and M546 quasi-connectivity. It does not claim sticky pull, BUD, player-pose rubber-banding, or a generic piston model. Headless B173WireClient protocol-14 only. No GUI. No Aero.
narrative.cycle=DataDrivenCycle rebuilds the west piston and cobble drop in two fresh official server JVMs. Each run Q-drops cobble 4 into the air head cell, Packet15-extends piston 33, and reloads the displaced Packet21 item after save plus fresh login. The frozen signal includes dx-west=true. One official EOF is retried after a 5 second sleep. Canonical evidence uses two official server JVMs and four client sessions. Headless protocol-14 only. No GUI. No Aero.
runner.source=tools/smoke/DataDrivenCycle.java
