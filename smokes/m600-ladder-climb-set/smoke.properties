narrative.claim=A player colliding with a ladder can climb or remain stationed on it. Protocol-14 Packet13 pose y increases or holds versus falling in air. This is distinct from M174 east-face placement, M361 client-physics climb, and M447 spider wall climb.
narrative.cycle=DataDrivenCycle rebuilds the raised two-cell east ladder fixture in two fresh official server JVMs. Each run Packet15-places ladder item 65 as two 65:5 cells, Packet13-falls in adjacent air, then Packet13-stations while occupying the ladder. Pose y must hold or increase versus the air fall. Both cells survive a clean save plus fresh login. One official EOF is retried after a five-second sleep. Headless B173WireClient protocol-14 only. No GUI. No Aero.

