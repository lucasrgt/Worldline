narrative.title=official Beta 1.7.3 redstone signal-consumer subsystem conformance
narrative.claim=One public TestKit mini-subsystem closes eighteen unresolved claims across dispenser, note block, TNT, torch, redstone wire, and jukebox. Universal state and physical helpers feed one tick-policy archetype and five singular neighbor transitions. Each powered transition commits and verifies the lever source state before the consumer callback, so scheduling, edge memory, and priming remain causal rather than inferred.
narrative.cycle=Run executes fresh mapped and untouched official-server worlds. Both enumerate the bounded TNT, wire, and jukebox metadata domains; inspect TNT and wire collision and light rows; invoke all six direct tick contracts; remove wire support; preserve the jukebox under a neighbor event; and drive dispenser scheduling, note rising-edge memory, and TNT priming from a raw committed powered lever state through RedstoneSignalConsumersFixture.
