narrative.schema=1
narrative.title=official Beta 1.7.3 sign subsystem lifecycle
narrative.claim=One public TestKit mini-subsystem executes standing sign 63 and wall sign 68 on the unmodified official Beta 1.7.3 server. It proves all sixteen standing rotations, gameplay item consumption, direct break and sign-item drop, paired Packet130 text persistence, passable collision, native light transport, bounded tick stability, and causal support invalidation with final persisted air.
narrative.cycle=DataDrivenCycle runs two fresh official-server replicas through SignSubsystemFixture. Each replica builds raised supports and measured movement lanes through gameplay, places and breaks every standing rotation, observes the first direct drop, places and writes a standing and wall pair, crosses a clean save and login, measures collision and light, holds both blocks for 240 ticks, breaks each support, and crosses a second clean save and login.

