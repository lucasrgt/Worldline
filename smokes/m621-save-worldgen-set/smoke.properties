narrative.claim=M621 closes the replay-safe save/chunk and bounded worldgen gaps for one fixed 3x3 Beta 1.7.3 region. It validates all nine McRegion location, timestamp, sector, zlib, and NBT-root frames; proves the geology census survives a clean save/restart; and requires multiple surface families, subsurface cave air, and at least three ore components.
narrative.cycle=DataDrivenCycle executes two fresh official-server replicas. Each replica generates and settles the exact region, validates its McRegion frames, restarts the same saved world, and compares the bounded geology, surface-family, cave-air, and ore-component census. The proof does not claim arbitrary seeds, biome names, structure generation, or mutable entity/tick state.

