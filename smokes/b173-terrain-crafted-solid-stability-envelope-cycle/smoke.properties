narrative.title=official Beta 1.7.3 terrain-crafted solid bounded stability envelope
narrative.claim=One data-driven mini-subsystem exercises eight terrain and crafted solids through a maintained public stability TestKit family on the unmodified official Beta 1.7.3 server. Seven inert rows close bounded tick stability and causal response to direct stone-overhead removal; the snow-block row closes neighbor response while retaining its unexercised high-light random-tick melt branch as PARTIAL.
narrative.cycle=DataDrivenCycle compiles one caller-owned terrain and crafted-solid matrix and runs sixteen claims in eight fresh official worlds per pass. Every row gameplay-places its target under a stone overhead, holds the target across a two-hundred-tick observation window, removes that direct neighbor with a diamond pickaxe, observes the unchanged target for forty more ticks, and crosses a fresh-login persistence boundary.

