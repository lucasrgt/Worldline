narrative.schema=1
narrative.title=ModLoader and Forge TestKit providers
narrative.claim=M767 adds `modloader-b1.7.3` and `forge-b1.7.3` as real TestKit runtime families. Each test receives a fresh hash-pinned single-player client, and a localhost control channel advances exactly one official game tick per TestKit command while exposing only lifecycle, world time, player identity, health, selected slot, and pose. Each session seals a profiler artifact and exits naturally. Broader gameplay mutation and performance equivalence remain unclaimed.
narrative.cycle=`M767ModloaderForgeTestkitProviderCycle` verifies the official client and historical loader hashes, prepares isolated Java 8 RetroMCP clients, compiles and discovers both providers through Java SPI, and runs two fresh TestKit cases per loader. Qualification requires four distinct processes, four controlled ticks, four checksum-valid profiler artifacts, and four clean shutdowns. Required local inputs are supplied through `WORLDLINE_LEGACY_BASE_WORKSPACE`, `WORLDLINE_LEGACY_LOADER_ARTIFACTS`, and `WORLDLINE_JAVA8_HOME`.
