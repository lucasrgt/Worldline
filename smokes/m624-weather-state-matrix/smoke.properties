narrative.claim=This milestone freezes deterministic Beta 1.7.3 rain and thunder transitions, countdown reseeding, strength ramps, and WorldInfo persistence.
narrative.cycle=M624 compares five mapped and official weather cases: dry-to-rain, rain-to-dry, calm-to-thunder, thunder-to-calm, and a simultaneous storm transition. Each case advances three weather updates, records countdown and strength state, and round-trips the final WorldInfo through NBT. Two mapped and two official processes must produce the same canonical trace.
