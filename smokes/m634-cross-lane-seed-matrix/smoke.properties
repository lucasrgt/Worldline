narrative.claim=M634 upgrades the single M114 portability probe to a permanent three-seed by four-chunk official-server matrix. Every case freezes non-air count and complete solid occupancy behind one aggregate semantic digest for Windows/Linux comparison.
narrative.cycle=DataDrivenCycle executes two fresh replicas. Each replica boots one official Beta 1.7.3 server per seed, captures the same four neighboring chunks, and compares the aggregate matrix digest. Mutable surface decoration is deliberately excluded after the discovery run proved that it can differ while solid occupancy remains equal. The proof excludes arbitrary seeds, distant chunks, structures, entities, client rendering, and GUI lanes.

