narrative.claim=One public TestKit family executes dandelion, rose, and the oak, spruce, and birch sapling item variants against the unmodified official Beta 1.7.3 server. Five isolated cases prove gameplay-provisioned dirt, exact item-variant consumption and placed metadata, two fresh-login boundaries, break to air, exact drops, and unchanged zero-hardness tools.
narrative.cycle=DataDrivenCycle compiles the generalized substrate-aware lifecycle provider and five caller-owned cases, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. The three sapling cases deliberately share one four-claim subject; case count is not presented as census-atom or milestone count.

