narrative.claim=One public TestKit family exercises seven complete cardinal placement metadata rows on the unmodified official Beta 1.7.3 server. Twenty-eight look-derived placements close 25 distinct reachable states, including a yaw-invariant chest negative control, and seven fresh logins prove every final grid persisted.
narrative.cycle=DataDrivenCycle compiles the reusable state-domain TestKit contract, the official-server provider, and seven caller-owned rows. Every row runs in a fresh isolated world, freezes canonical per-step evidence, and requires exact inventory consumption, complete declared state closure, a fresh-login boundary, and provider-owned shutdown.

