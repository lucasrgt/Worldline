narrative.title=official Beta 1.7.3 redstone input-control subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps lever 69, stone pressure plate 70, wooden pressure plate 72, and stone button 77 across their reachable active-state domains, state-dependent selection bounds, empty collision boxes, zero light opacity and emission, native latch or twenty-tick policies, entity selectivity, and support-loss removal with one item drop. Existing lifecycle, persistence, native rendering, and downstream wire propagation evidence remain independently owned and are not counted here.
narrative.cycle=Run executes two fresh mapped worlds and two untouched official-server worlds. Every replica toggles a floor lever, pulses a wall button, contrasts player and dropped-item pressure-plate activation, releases timed controls through native update ticks, measures native block bounds and light tables, and removes each required support through RedstoneInputControlsSubsystemFixture.
