narrative.cycle=Run executes two mapped and two official fresh-process fixtures on seed 1772835215. Each fixture finds adjacent cold-biome cells, starts with still water 9:0 beside flowing water 8:1, and advances the ordinary 19-by-19 ambient scheduler. FlowingWaterFreezeFixture bounds the scheduler to sixteen passes and excludes the successful random pass and coordinates from equatable evidence.
