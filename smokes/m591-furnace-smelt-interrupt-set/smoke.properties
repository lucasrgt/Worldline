narrative.title=furnace smelt interrupt set
narrative.claim=Removing furnace input or fuel mid-progress prevents a completed cobble-to-stone output that would otherwise finish. One idle furnace 61:2 completes cobble 4 plus coal 263 to stone 1. A second furnace loads the same recipe, waits until burning 62, then Packet102 takes the input; slot 2 stays empty past cook 200. A third furnace loads coal, waits 40 ticks, Packet102 takes that fuel, then loads cobble without fuel; slot 2 stays empty. Distinct from M60 complete smelt, M221 idle placement, M296 recipe outputs, and M338 fuel burn durations.
narrative.cycle=DataDrivenCycle rebuilds the raised stone fixture in two fresh official server JVMs. Each run places three idle furnaces 61:2, completes one cobble smelt as the otherwise-finish control, then interrupts input mid-cook and fuel before consume. One official EOF is retried after a 5 second sleep. Headless B173WireClient protocol-14 only. No GUI. No Aero.
