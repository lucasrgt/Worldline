narrative.title=official Beta 1.7.3 redstone device lifecycle family
narrative.claim=One public TestKit family executes unpowered redstone wire, an unpowered repeater, and a closed east-face trapdoor against the unmodified official Beta 1.7.3 server. Three isolated rows prove item-to-block placement, exact initial metadata, two fresh-login boundaries, break to air, exact historical item drops, and an unchanged stick.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle provider and three caller-owned redstone-device rows, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Power transitions, repeater delay and orientation domains, trapdoor activation, neighbor propagation, support removal, and native rendering remain independent behavior families.

