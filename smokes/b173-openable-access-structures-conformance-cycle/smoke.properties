narrative.claim=One public TestKit mini-subsystem resolves the final ten Functional Census cells across chest, wooden door, and trapdoor. It binds native scheduled-tick enrollment, direct callback stability, exact open and closed collision geometry, light opacity and emission, the complete trapdoor metadata domain, and causal support-loss cleanup to one official differential contract.
narrative.cycle=Run executes fresh mapped and untouched official-server worlds. Each replica invokes chest, wooden-door, and trapdoor tick callbacks, applies stable neighbor updates, measures wooden-door closed and open bounds, enumerates all eight trapdoor metadata states and five collision envelopes, reads native light policy, then removes the trapdoor support and proves air plus one native trapdoor drop through OpenableAccessStructuresFixture.
