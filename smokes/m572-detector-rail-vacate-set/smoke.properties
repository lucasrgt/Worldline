narrative.claim=M572 opens the official detector-rail occupy-then-vacate boundary. A sloped detector rail 28 powers while a minecart occupies it, then unpowers after the cart rolls onto a lower landing rail. This is distinct from unpowered detector place (M185) and occupied-and-persisted detector geometry (M402).
narrative.cycle=DataDrivenCycle rebuilds the sloped detector and landing rail in two fresh official server JVMs. Each run places minecart 328 on detector 28, observes powered occupancy, waits until the cart leaves and the rail unpowers, then reloads the vacated cells after save plus fresh login. Headless protocol-14 only. No GUI. No Aero.
