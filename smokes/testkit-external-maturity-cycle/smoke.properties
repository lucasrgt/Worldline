narrative.title=public external mod consumption and honest 1.0 readiness
narrative.claim=The testkit-external-maturity structural contract executes nine real external tests: four AeroModelLib CPU differentials and five BetaEnergistics terminal/catalog tests. Both immutable checkouts resolve the public 0.3.0 Gradle plugin and digest-pinned release JARs without Worldline source, included builds, private product classes or Minecraft. TestKitMaturityFixture assesses dated successful public use by distinct mod repositories. The reviewed policy requires at least two successful dates spanning seven days for each of two mods; duplicate same-day runs, private-checkout history, future records and reused proof IDs cannot promote 1.0.
narrative.cycle=An isolated Gradle user home downloads public inputs, guards compile and runner classpaths, runs unchanged external specifications and requires exact passing counts plus clean tracked consumer sources. BetaEnergistics has a public five-test CI receipt on 2026-08-25 and the new current capture. Aero has a fresh public four-test capture; its current 0.3.1 suite previously used an unpublished local included build. An older 0.2 Aero branch has a green general CI run, but that workflow did not execute the Worldline suite, so it is not counted as historical TestKit execution. The frozen assessment therefore has two public consumers, one sustained consumer and blocked 1.0 promotion. The release-gate implementation and current consumer baseline are qualified; promotion awaits another dated public Aero success at least seven days after the first. This is a dependency-provenance check, not a filesystem security sandbox, and it does not claim loader runtime compatibility or publish a release. Functional Census delta is zero.
