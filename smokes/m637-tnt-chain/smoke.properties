narrative.title=TNT chain reaction
narrative.claim=M637 qualifies the Beta 1.7.3 TNT chain-reaction boundary. Packet15 with flint and steel primes the first of two adjacent TNT 46 blocks. Its strength-four Packet60 explosion must produce a distinct second Packet23 type-50 primed object and a second strength-four Packet60 explosion. Both charge cells persist as air. The claim excludes exact fuse durations, crater shape, player damage, redstone priming, minecarts, and chains longer than two charges.
narrative.cycle=DataDrivenCycle executes two fresh official dedicated-server replicas at seed 17320110707. Each builds two adjacent raised TNT charges, directly primes only the first, then observes two ordered primed-object/explosion pairs and verifies both cells after a fresh login. TntChainFixture binds the second primed object to the adjacent charge and normalizes entity IDs, exact fuse timing, explosion-propelled motion, final second-explosion center, and crater blocks while rejecting nonadjacent charges, duplicate objects, wrong strength, or surviving TNT.

