narrative.schema=1
narrative.title=official Beta 1.7.3 bedrock subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps bedrock block 7 through its native ItemBlock placement and strength-gated player-break lifecycle. It proves metadata zero and stack consumption, zero break strength with an unchanged cell and no reachable drop, chunk-NBT persistence, full collision, opaque unlit transport, unscheduled stable tick-callback behavior, and stable neighbor handling.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica places a provided bedrock item through the native Item route, applies the same strength threshold used by the server break manager, preserves the unbreakable cell and empty legal drop surface, reloads a native chunk-NBT state, measures collision and light tables, invokes the native tick callback, and applies stone and lever neighbor notifications through BedrockSubsystemFixture.
