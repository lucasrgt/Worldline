narrative.title=official Beta 1.7.3 mushroom random-tick conformance subsystem
narrative.claim=One public TestKit mini-subsystem exercises brown and red mushrooms through metadata-zero state, passable collision, controlled nonzero light transport, native same-species random-tick spread, an invalid glass control, causal support invalidation, and persisted post-event state. The bounded winning window and random target coordinate are deliberately excluded from equatable evidence.
narrative.cycle=BlockRandomTickSpreadFamilyCycle executes one species per fresh official world. Each row gameplay-places thirty sources across two stacked roofed decks, compares air and mushroom physical probes, observes same-species spread within forty 400-tick windows, removes the exact stone support under the controlled edge probe, and crosses a fresh-login boundary. Two full milestone executions must match without freezing the successful RNG draw.

