narrative.title=official Beta 1.7.3 farmland subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps farmland block 60 as a stateful random-tick soil block with native ItemBlock placement, finite break strength, one dirt drop, complete moisture metadata 0 through 7, hydrated chunk-NBT persistence, full collision despite fifteen-sixteenths visual height, opacity 255 with zero emission, and deterministic air-above stability versus solid-cover conversion to dirt. Existing tick-policy and native-render evidence remain independently owned and are not count-farmed here.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica places a supplied farmland item, applies the server harvest sequence and identifies the exact dirt drop, hydrates metadata 0 to 7 with adjacent water, serializes native chunk NBT, removes the water and deterministically traverses moisture 7 to 0, measures collision bounds, visual height, cube flags and light tables, proves random-tick enrollment, and contrasts ordinary neighbor stability with causal solid-cover conversion through FarmlandSubsystemFixture.
