narrative.cycle=The cycle pins an exact clean Aero revision and hashes the production cache source and external probe, compiles both with javac release 8, then executes six fresh counterbalanced JVMs across default, false, and true startup policy arms. Every arm checks exact output, same-world array identity, and two-way world-switch eviction. It does not launch Minecraft or claim GPU performance.
