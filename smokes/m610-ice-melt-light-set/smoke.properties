narrative.title=Ice melt light set
narrative.claim=M610 qualifies torch-adjacent ice melt as one SET. Packet15 places ice item 79 on a raised stone support and floor torch item 50:5 on the east neighbor so official block light plus random ticks melt ice 79:0 to still water 9:0. The leftover persists across a clean save plus fresh login. This family is distinct from M193 ice place without melt and from M386 ice-and-snow compound melt. It does not claim snow melt, silk-touch, slipperiness, or biome/global melt. Headless B173WireClient protocol-14 only. No GUI. No Aero. Exact melt delay is not hashed.
narrative.cycle=DataDrivenCycle rebuilds the raised-stone ice-and-torch fixture in two fresh official server JVMs. Each run Packet15-places ice 79 beside floor torch 50:5, then waits a bounded official-tick window until the ice cell is still water 9:0. One official EOF is retried after a 5 second sleep. Canonical evidence uses two official server JVMs and four client sessions. Headless protocol-14 only. No GUI. No Aero.
