narrative.title=official Beta 1.7.3 fire subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps fire block 51 as a support-dependent, transparent, luminous, noncollidable random-tick block with native ItemBlock placement, infinite break strength, no drop, complete age metadata 0 through 15, direct chunk-NBT persistence, and deterministic supported-versus-support-loss neighbor behavior. Existing fire spread and native-render evidence remain independently owned and are not count-farmed here.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica places a supplied fire item on netherrack, applies the server harvest sequence, advances the native update callback through all sixteen ages with deterministic Random inputs, reloads native chunk NBT at age 15, measures collision and light tables, reads random-tick enrollment and tick rate, proves netherrack-supported stability, and removes stone support to trigger causal extinguishing through FireSubsystemFixture.
