narrative.claim=M655 qualifies the exact live official Beta 1.7.3 rain-stop transition. A protocol-14 client first observes the raining login bootstrap Packet70 reason 1, then the same connection is armed and observes Packet70 reason 2 when the bounded rain countdown expires. Equatable public evidence records raining-before and dry-after. This does not claim rain rendering, precipitation effects, thunder, commands, or a minimum rain duration.
narrative.cycle=DataDrivenCycle rebuilds two fresh official dedicated-server replicas. Each replica creates a vanilla world, patches only the level.dat weather fields to raining with a bounded positive rain countdown and thunder disabled, then connects one headless protocol-14 client. Login Packet70 reason 1 establishes the initial raining state before arming. The live WorldServer weather update must then broadcast Packet70 reason 2, which RainStopFixture binds to raining-before and dry-after evidence. The patch preserves seed, time, and spawn identity. Both client and server disconnect cleanly. No GUI. No Aero.
