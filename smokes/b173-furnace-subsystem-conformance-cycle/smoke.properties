narrative.title=official Beta 1.7.3 furnace subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps idle furnace 61 and lit furnace 62 as a stateful tile machine. It proves four orientations, ignition, a complete sand-to-glass smelt, extinction, active break and inventory drops, chunk-NBT progress recovery, full collision, light, and stable neighbor handling.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Each replica materializes both domains, records nonzero burn and cook progress, completes exactly 200 tile ticks, reloads active block and inventory state through native chunk NBT, breaks a populated active furnace, and compares the complete canonical trace through FurnaceSubsystemFixture.
