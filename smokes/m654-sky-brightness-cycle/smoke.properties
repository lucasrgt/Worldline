narrative.claim=M654 freezes the exact clear-weather Overworld skylight-subtraction cycle at canonical Beta 1.7.3 world times. The public evidence closes from subtraction 0 through the dusk ramp to the night plateau 11 and back through the dawn ramp to 0. It does not claim renderer color, weather attenuation, or Nether lighting.
narrative.cycle=Run executes two fresh mapped server worlds and two direct official-server oracle worlds. Each in-memory world rejects terrain access, sets thirteen canonical world times, recomputes the clear-sky field, and records both time and skylight subtraction as equatable evidence. Qualification requires deterministic replicas and a byte-identical mapped-versus-official canonical trace.
