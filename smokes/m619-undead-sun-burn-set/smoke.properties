narrative.title=undead sun burn set
narrative.claim=M619 opens the official undead sunlight combustion SET. A fixture zombie (type 54) in open sky catches Packet40 fire flag 1 after server.setTime 6000, while the same undead stay unburned at night 14000 and under a 5x5 stone roof at day. This is distinct from M435 natural spawns; the spawner is fixture only.
narrative.cycle=DataDrivenCycle executes UndeadSunBurnSetSmoke twice on fresh official server JVMs. Each run builds an open zombie-spawner pad and a roofed pad, rewrites EntityId and Delay, proves night Packet40 flags 0, then day open fire versus shaded absence. One official EOF is retried after a 5 second sleep. Headless B173WireClient protocol-14 only. No GUI. No Aero.
