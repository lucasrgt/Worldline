narrative.title=Aero chunk scheduler visual-latency classification
narrative.claim=Four counterbalanced pairs classify Aero camera-aware chunk scheduling against the page-cache baseline in fresh real clients, including direct visible dirty-to-rebuild latency, fresh world load, visible-backlog drainage, hitch rate, FPS, p99, and allocation.
narrative.cycle=M783 prepares one 576-machine save, then runs eight fresh clients over at least 600 retained frames each. Every client loads an identical copied world, then walks, turns, teleports, mutates visible, look-ahead, and background chunks, stops generating work after the acquisition window, and either drains stably or records its bounded frame-1,200 residual. Promotion requires zero candidate in-frustum and explicitly pending work; residual off-screen work remains classified separately. The evidence deterministically says promote or keep-disabled.
