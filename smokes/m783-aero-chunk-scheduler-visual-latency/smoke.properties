narrative.title=Aero chunk scheduler visual-latency classification
narrative.claim=Four counterbalanced pairs classify Aero camera-aware chunk scheduling against the page-cache baseline in fresh real clients, including direct visible dirty-to-rebuild latency, a midpoint renderer world rebind, backlog drainage, hitch rate, FPS, p99, and allocation.
narrative.cycle=M783 prepares one 576-machine save, then runs eight fresh clients over at least 600 retained frames each. Every route walks, turns, teleports, mutates visible, look-ahead, and background chunks, rebinds the active world to the renderer at the midpoint, stops generating work after the acquisition window, and ends only after the backlog and visible-latency census drain. The evidence deterministically says promote or keep-disabled.
