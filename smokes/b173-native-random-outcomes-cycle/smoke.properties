narrative.title=native gravel and fishing finite random outcomes
narrative.claim=The native-random-outcomes behavior (WorldlineEnvironmentBehaviors.NATIVE_RANDOM_OUTCOMES) covers all ten gravel drop residues, all 500 dry and 300 exposed-rain fishing draws at water depths one, three and five, all 30 catch-window durations and first-bite schedules at ticks one, five and seventeen. RandomOutcomeFixture#verify requires the complete ordered draw trace and actual catch counter, rod cost, spawned item count and hook death. The existing finite Functional Census gains no cells: gravel drop and fishing event cells already existed, while this package adds their quantitative and timing boundaries.
narrative.cycle=Four fresh JVMs execute mapped A/B and untouched official A/B. Original memory storage creates native worlds, chunks, players and hooks. Controlled Random supplies explicit bounded integer residues, fixed floating draws and rejects missing or extra integer calls. Native BlockGravel.idDropped, EntityFish.onUpdate and catchFish determine outcomes. Each stimulus anchors the hook submerged with zero motion while preserving its native counter; a native constant-plains biome manager, rain strength and native sky exposure are checked preconditions. Exhaustive uniform integer residues establish a conditional gravel flint rate of 1/10 and fishing bite probabilities of 1/500 or 1/300 per eligible tick. Native catches produce one raw fish at every tested depth; expired windows produce no catch. This does not assert seed-generator quality, an unconditioned real-world waiting-time distribution, moving-hook trajectories, all water geometries or post-Beta loot tables. No native behavior is overridden and no official assets or source are distributed.
