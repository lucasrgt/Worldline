narrative.claim=One public TestKit family executes stone, sandstone, wood, and cobblestone single-slab metadata plus the double stone slab against the unmodified official Beta 1.7.3 server. Five isolated rows prove exact item-variant consumption, placed state, two fresh-login boundaries, break to air, historical single-or-double drops, and tool state.
narrative.cycle=DataDrivenCycle compiles five caller-owned slab cases, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Four rows deliberately share the single-slab census subject; the package is one stateful construction subsystem rather than five milestones.

