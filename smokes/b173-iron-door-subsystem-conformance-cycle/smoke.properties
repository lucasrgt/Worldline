narrative.schema=1
narrative.title=official Beta 1.7.3 iron-door subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps iron-door block 71 as a directional, redstone-aware two-cell structure. It proves lower and upper metadata domains with the native open bit; finite removal and lower-only item drops; distinct closed and open collision planes; nonopaque unlit transport; unscheduled stable callbacks; and causal paired stability, orphan cleanup, and support-loss cleanup. Existing placement, save-reload, native-render, and powered open-close evidence remain independently owned and are not count-farmed here.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica constructs all four directional lower and upper pairs, toggles the native open bit, harvests isolated halves, identifies the asymmetric iron-door item drop, measures closed and open collision bounds plus light tables, invokes inherited callbacks, and contrasts stable pairs with orphan and floor-support cleanup through IronDoorSubsystemFixture.
