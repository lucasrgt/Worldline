narrative.claim=Unsupported gravel becomes a Packet23 falling-gravel entity, then places as gravel 13:0 when it lands, or drops as an item if that cell cannot accept the block. This SET proves the observed entity type plus the persisted landed gravel. It is distinct from M119/M597 sand type 70, M274 block-only gravel settle, and M342's sand-plus-gravel pair.
narrative.cycle=DataDrivenCycle rebuilds the supported-gravel fixture in two fresh official server JVMs. Each run removes the stone support, records the live Packet23 object type from the official oracle, waits for gravel 13:0 to land, and reloads that cell after save plus fresh login. One official EOF is retried after a 5 second sleep.
