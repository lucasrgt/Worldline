narrative.claim=Standing in still lava 11:0 deals repeated Packet8 health drops while the player stays alive. The first accepted hit is 20 to 16; the next is 16 to 13. Vanilla typically also ignites the player. This is distinct from M138 lava place/flow and from M465 lava death to health 0.
narrative.cycle=DataDrivenCycle rebuilds a raised stone basin of still lava 11:0 in two fresh official server JVMs. Each run places lava bucket 327, stands in the source, records two Packet8 drops 20 to 16 to 13 with Packet38 status 2, then leaves so health 13 persists across a fresh login. One official EOF is retried after a 5 second sleep. Headless B173WireClient protocol-14 only. No GUI. No Aero.
