narrative.claim=M638 qualifies the Beta 1.7.3 creeper-versus-TNT explosion-strength differential. An official proximity-fused creeper emits Packet60 strength 3. An official flint-primed TNT emits Packet60 strength 4. The normalized difference is exactly one and TNT is stronger. The claim excludes crater size, destroyed-block count, player damage, fuse duration, powered creepers, beds, and chains.
narrative.cycle=DataDrivenCycle executes two fresh composite replicas. Each replica runs the already-qualified M391 creeper explosion scenario and M381 TNT prime scenario in independent fresh official-server workspaces, then compares their Packet60 strengths through CreeperTntDifferentialFixture. Nested evidence remains fail-closed; entity IDs, coordinates, crater RNG, and timing never enter the differential.

