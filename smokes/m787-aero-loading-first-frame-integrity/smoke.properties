narrative.schema=1
narrative.title=Aero loading and cold first-frame integrity
narrative.claim=Two fresh clients prove that restored-world loading follows the vanilla Loading/reset/Loading sequence with exactly one building and one simulation stage and without render-world or pre-bake work during loading, then require cold Cell Pages and the direct reference to render all 576 machines with exact paired RGBA pixels from the first visible frame through cache convergence and a complete moving-camera route.
narrative.cycle=M787 prepares one deterministic four-tower save and loads it in two fresh replicas. Each client records the exact restored-world Loading level, blank reset, Loading level, Building terrain, and Simulating world for a bit sequence, rejects any render-world call before loading completes, disables speculative prewarm and culling, and begins without render warmup. For each capture it installs explicit projection and modelview matrices, submits all 576 fixtures through cold Cell Pages, captures RGBA, clears color and depth, renders the direct reference in the same OpenGL context, and captures the paired RGBA image. The first sixteen frames are consecutive and the remaining checkpoints cover orbit, traverse, spin, teleport, and close inspection. Both replicas require cold direct fallback, page-cache convergence to exactly 576 template calls and zero direct fallbacks on the final frame, and zero changed pixels across all eighty in-context comparisons.
