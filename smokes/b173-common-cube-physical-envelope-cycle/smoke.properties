narrative.claim=One data-driven mini-subsystem exercises five metadata-zero opaque full cubes through the public state-domain, collision, and light TestKit families on the unmodified official Beta 1.7.3 server. It closes fifteen Functional Census claims without treating each block or dimension as a separate milestone.
narrative.cycle=DataDrivenCycle compiles one caller-owned common-cube catalog and runs three maintained public TestKit families. Each dimension owns five fresh worlds, exact inventory consumption, canonical evidence, and a fresh-login persistence boundary; collision uses fifteen bounded trajectories and light samples exact source skylight.

