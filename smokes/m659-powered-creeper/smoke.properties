narrative.claim=M659 freezes the official Beta 1.7.3 transformation in which an explicitly unpowered creeper is struck by an observed native lightning entity at the same cell and the same creeper identity becomes powered. The powered state must remain present after one observation tick; explosion behavior is not claimed.
narrative.cycle=Run compares two fresh mapped executions with two direct official-server oracle executions. Each in-memory world joins one creeper, records its unpowered prerequisite and identity, joins a native lightning entity at the creeper cell, observes both entities and the live strike, invokes the native lightning callback, and records the same creeper as powered immediately and after one runtime tick. Equatable evidence normalizes process-local entity numbers into explicit identity-preservation and same-cell facts.
