narrative.claim=One archetype mini-subsystem exercises still water and still lava through the public state-domain, collision, and light TestKit families. Six executable claims distinguish passable fluid cells, shared skylight attenuation, and lava emission while preserving both source states across fresh logins.
narrative.cycle=DataDrivenCycle compiles one caller-owned source-fluid catalog and runs three maintained public TestKit families. Two state rows, two collision rows, and two light rows each own fresh worlds, exact inventory consumption, canonical evidence, and a fresh-login persistence boundary.

