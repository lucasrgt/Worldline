narrative.schema=1
narrative.title=official Beta 1.7.3 portal block subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps portal block 90 from valid frame materialization through destruction. It proves both frame axes and the metadata-zero state domain, six-cell interiors, empty drops, chunk-NBT persistence, null collision, opacity and emission, unscheduled stable tick-callback behavior, and full collapse after frame loss.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica builds canonical obsidian frames in both axes through the native portal materialization path, invokes the native tick callback while proving the block is not scheduler-enrolled, removes one supporting frame cell, breaks a portal cell through the native drop path, reloads six cells through native chunk NBT, and measures collision and light tables through PortalBlockSubsystemFixture.
