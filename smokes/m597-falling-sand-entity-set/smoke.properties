narrative.claim=Unsupported sand becomes a Packet23 falling-sand entity, then places as sand 12:0 when it lands. This SET proves the observed entity type plus the persisted landed block. It is distinct from M119's block-only settle, M274 gravel, and M342's sand-plus-gravel pair.
narrative.cycle=DataDrivenCycle rebuilds the supported-sand fixture in two fresh official server JVMs. Each run removes the stone support, records the live Packet23 object type from the official oracle, waits for sand 12:0 to land, and reloads that cell after save plus fresh login. One official EOF is retried after a 5 second sleep.
