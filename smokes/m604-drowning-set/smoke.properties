narrative.claim=M604 opens the official drowning Packet8-damage SET. Two-deep still water over the eye empties the air meter and deals Packet8 20->18 with Packet38 status 2. Health stays 18. This is distinct from M465 lava+drown+suffocate death to 0 and from M307 compound drown+suffocate+lava hurt.
narrative.cycle=DataDrivenCycle rebuilds the two-deep still-water fixture in two fresh official server JVMs. Each run submerges Drown604, waits through the air-meter window with WorldlineSmokeAwait, then requires Packet8 20->18 and Packet38 status 2 without death. One official EOF is retried after a 5 second sleep. Canonical evidence uses two official server JVMs and two client sessions. Headless B173WireClient protocol-14 only. No GUI. No Aero.
