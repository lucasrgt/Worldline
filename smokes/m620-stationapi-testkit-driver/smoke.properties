narrative.schema=1
narrative.title=StationAPI TestKit driver
narrative.claim=M620 adds StationAPI as the second real TestKit runtime family. The neutral runner discovers `stationapi-b1.7.3` through Java SPI, and each test receives a fresh official Beta 1.7.3 server plus a fresh Fabric/StationAPI client. A localhost control channel gates the real client game thread one tick at a time and exposes only the qualified read-only state: lifecycle, world time, player identity, health, selected slot, and pose. The Worldline-owned runtime overlay also seals one capability-exact profiler artifact per client. Block mutation, teleport, inventory mutation, GUI control, and broader StationAPI behavior remain fail-closed and unclaimed.
narrative.cycle=`M620StationapiTestkitDriverCycle` verifies the pinned client and server hashes and the pinned clean Aero checkout that owns the bare StationAPI Gradle project. It compiles the external adapter, publishes its `TestRuntimeProvider` service descriptor, compiles one Java 8 TestKit spec, and runs two cases. Each case opens and closes distinct client/server process trees, observes official login and chunk readiness, advances exactly one gated client tick, validates finite player state, and seals a nonempty WLPR capture. The complete isolated qualification is `java tools/harness/Gate.java --milestone m620-stationapi-testkit-driver`.
