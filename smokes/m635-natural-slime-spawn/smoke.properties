narrative.title=natural slime spawn
narrative.claim=M635 freezes natural Beta 1.7.3 slime spawning inside a formula-selected 7x7 chunk matrix below height sixteen. The fixed matrix contains sixteen independently verified slime chunks. The fixture controls subterranean geometry only: it solidifies the matrix below y=60 and carves three vertically separated 14x14x4 rooms entirely below y=16 in each qualifying chunk. It never places or rewrites a mob spawner. After a clean restart with monsters enabled, the official loop must emit a type-55 Packet24 in one of those exact formula-selected chunks. The claim excludes swamp spawning, arbitrary seeds, spawn frequency, exact coordinates, exact slime size, and slime combat.
narrative.cycle=DataDrivenCycle runs two fresh official dedicated-server replicas at seed 17320110707 with view distance three. Each replica generates and saves all 49 loaded chunks with monsters disabled, controls their underground block geometry, then restarts with monsters enabled and a central surface observer more than 24 blocks from every room. NaturalSlimeSpawnFixture owns a 4,800-attempt bound, revalidates the successful chunk formula, and normalizes entity ID, coordinate, tick, and size variation. No spawner block, spawner NBT, mob insertion, or runtime RNG write is used.
