narrative.title=official Beta 1.7.3 static collision envelopes
narrative.claim=One public TestKit family compares air controls with gameplay-placed stone, slab, stairs, fence, and torch treatments on the unmodified official Beta 1.7.3 server. Ten bounded trajectories distinguish full-cube, half-step, directional step, raised-fence, and empty-collision envelopes, while five fresh logins preserve every treatment scene.
narrative.cycle=DataDrivenCycle compiles the reusable collision TestKit contract, official-server provider, and five caller-owned rows. Every row owns a fresh world, requires exact item consumption, records server corrections and displacement, re-centers after every probe, and proves its placed geometry across a fresh login.

