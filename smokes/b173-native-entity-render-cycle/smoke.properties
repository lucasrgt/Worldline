narrative.claim=The native-entity-render behavior (WorldlineRenderBehaviors.ENTITIES) covers registry-to-renderer dispatch, living models and held items, and objects, projectiles and vehicles for all 23 concrete EntityList subjects. The abstract EntityLiving registration is checked explicitly without fabricating an instance. NativeEntityRenderFixture#verify accepts an explicit expected family and rejects missing, duplicate, reordered or misidentified observations; NativeEntityRenderEvidence binds each subject and claim layer to its renderer, nonempty RGBA pixels and exact frame hash. The frozen smoke catalog requires the complete concrete family; smaller caller-defined families can reuse the public verifier.
narrative.cycle=NativeEntityRenderCycle runs four fresh Pbuffer processes: mapped A and B, then untouched official A and B. Original Worldline setup fixes brightness, pose, partial tick and camera while official native renderers and textures produce the frames. Arrow yaw is initialized to 45 degrees because its zero-angle constructor pose is not a settled flight render state. Qualification requires repeat equality, mapped-official equality, native class provenance, nonzero geometry and the frozen family signature. Provenance remains a separate runtime guard rather than an equatable pixel observation. This boundary excludes shadow/fire passes, exhaustive animation or skin states, world-scene composition and cross-GPU pixel portability. No official assets or decompiled sources are distributed.
