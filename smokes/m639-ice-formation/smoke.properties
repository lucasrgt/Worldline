narrative.claim=Cold-biome source water freezes during the native ambient scheduler below block light ten, while an otherwise identical high-light control remains still water.
narrative.cycle=Run executes two mapped and two official paired fixtures on seed 1772835215. Each pair activates the ordinary 19-by-19 ambient chunk scheduler over identical still-water surfaces, with one world below the block-light boundary and one pinned at light fifteen. IceFormationFixture bounds the scheduler to sixteen passes and excludes the successful random pass and coordinate from equatable evidence.
