narrative.title=official Beta 1.7.3 native 3D inventory render family
narrative.claim=M703 opens the native-render Functional Census dimension for the 63 registered blocks whose official RenderBlocks route is three-dimensional in inventory. Every row binds a canonical metadata-zero subject to its exact render type, textured RGBA frame, nonzero geometry coverage, and public NativeBlockRenderFixture evidence. The 33 icon, fluid, fire, rail, door, sign, and other special routes remain explicitly outside this milestone.
narrative.cycle=M703Native3dInventoryRenderCycle loads the hash-pinned official terrain atlas and executes four fresh Pbuffer processes: mapped A and B, then official A and B. Each process renders all 63 declarative rows through the native RenderBlocks inventory method, reads 96x96 RGBA pixels, and emits canonical public TestKit evidence. Qualification requires repeat equality, mapped-official equality, exact class provenance, five accepted 3D render types, and the frozen family signature.
