narrative.title=portal invalid frame rejection
narrative.claim=Official Beta 1.7.3 rejects an upright four-by-five obsidian portal frame when one required inner block of its top edge is absent. Flint and steel creates observable fire in the empty interior, but no portal block 90 appears during the bounded twenty-tick window or after save and fresh login. All thirteen placed obsidian blocks persist and the required gap stays air. Existing qualified M132 and M382 cycles provide the corresponding complete-frame activation boundary. This does not claim behavior for horizontal frames, other frame sizes, later frame damage, extinguishing, or portal traversal.
narrative.cycle=DataDrivenCycle rebuilds two fresh official dedicated-server replicas. A protocol-14 builder raises a deterministic stone column, places thirteen obsidian blocks around six air interior cells, and leaves the second inner block of the top edge absent. Packet15 flint-and-steel ignition must first yield observable fire 51, proving that the action reached the fixture. A telemetered twenty-tick observation and a save plus fresh reader then prove zero portal 90 cells while PortalInvalidFrameFixture compares the live and persisted topology as equatable evidence. Headless only. No GUI. No Aero.
