narrative.title=Aero shipped Cell Page default and rollback
narrative.claim=Eight fresh clients in four counterbalanced pairs verify that the published Aero revision enables bounded Cell Page queue reuse without a flag and that the explicit false rollback remains functional, visually exact, and performance-safe.
narrative.cycle=M790 restores the M789 576-machine four-chunk route, then runs four counterbalanced rollback/default pairs in fresh clients. Both arms warm and render the identical ordered Cell Page template path. The rollback arm explicitly sets aero.becell.queueReuse=false; the default arm omits the property entirely on the published Aero revision. Each arm measures at least 1,200 frames and 20 seconds after 480 route frames and cache convergence. Twenty-four full RGBA checkpoints per arm prove cross-arm output and same-arm repeatability. Pool counters must show zero reuse under rollback and bounded steady-state reuse under the unconfigured default, while frame, allocation, render, hitch, visual, cache, and workload gates remain satisfied.
