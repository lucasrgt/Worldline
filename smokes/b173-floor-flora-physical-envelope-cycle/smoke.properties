narrative.title=official Beta 1.7.3 remaining opaque-cube physical envelopes
narrative.claim=One data-driven mini-subsystem exercises white wool, double stone slab, sand, and gravel through the public state-domain, collision, and light TestKit families on the unmodified official Beta 1.7.3 server. Each metadata-zero opaque cube is gameplay-placed on the existing stone pad, so sand and gravel stay supported. It closes twelve Functional Census claims without treating each block or dimension as a separate milestone.
narrative.cycle=DataDrivenCycle compiles one caller-owned remaining-cube catalog and runs three maintained public TestKit families. Each dimension owns four fresh worlds, exact inventory consumption, canonical evidence, and a fresh-login persistence boundary; collision uses twelve bounded trajectories and light samples exact source skylight.

