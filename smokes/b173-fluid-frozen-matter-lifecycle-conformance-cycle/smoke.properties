narrative.title=official Beta 1.7.3 fluid and frozen-matter lifecycle conformance
narrative.claim=One public TestKit mini-subsystem resolves twenty-one remaining Functional Census cells across moving and still fluids, sponge, snow layer, ice, and snow block. It binds item-route placement, empty fluid harvest, the complete flowing-lava metadata domain, native tick and neighbor stability, snow support loss, ice-to-water harvest, and exact physical envelopes to one official differential contract.
narrative.cycle=Run executes fresh mapped and untouched official-server worlds. Each replica places supplied moving-water and moving-lava items, consumes both stacks, removes all four fluid states without drops, enumerates flowing-lava metadata zero through fifteen, invokes sponge and snow native callbacks, causally removes snow-layer support to air, harvests ice over solid support into water, measures ice collision, and proves snow-block random-tick stability through FluidFrozenMatterFixture.
