narrative.claim=One public TestKit family executes brown and red mushroom lifecycles against the unmodified official Beta 1.7.3 server. Two isolated cases prove gameplay-provisioned dirt and controlled stone overhead, exact placement consumption and state, two fresh-login boundaries, break to air, exact self-drops, and unchanged zero-hardness tools.
narrative.cycle=DataDrivenCycle compiles the overhead-aware lifecycle provider and two caller-owned cases, runs them in fresh official server workspaces, repeats the family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. The package is one light-sensitive vegetation mini-subsystem, not eight atom-sized milestones.

