narrative.title=official Beta 1.7.3 native special world block-render family
narrative.claim=This milestone closes the native-render Functional Census cell for all 30 registered blocks routed through the 13 special RenderBlocks world paths. Every canonical metadata-zero row binds its exact official render type to a textured nonempty RGBA frame and reusable public TestKit evidence. Standing signs, wall signs, and moving pistons remain explicit tile-entity-render boundaries.
narrative.cycle=NativeWorldRenderCycle loads the hash-pinned official terrain atlas and executes four fresh Pbuffer processes: mapped A and B, then official A and B. Each process supplies the same deterministic IBlockAccess neighborhood, renders all 30 declarative rows through native RenderBlocks and Tessellator code, reads 128x128 RGBA pixels, and emits canonical public TestKit evidence. Qualification requires repeat equality, mapped-official equality, exact class provenance, all 13 special render types, nonzero geometry, and the frozen family signature.
