narrative.claim=M615 opens the official 1-tick redstone pulse boundary. Packet15 turns east wall lever 69:1 to 69:9, then Packet15 cuts it immediately so the pulse is one Packet53 on-then-off. Sticky piston 29 retracts without pulling, leaving cobble in the pushed cell. Distinct from M555 torch burnout, M341 delay cycling, M142 held extension, and retracted M557's 4-tick hold that never observed 69:9.
narrative.cycle=DataDrivenCycle rebuilds the west sticky 29 and east wall lever in two fresh official server JVMs. Each run cuts the lever on Packet53 69:9, latches dropped cobble, and reloads those cells after save plus fresh login. Headless protocol-14 only. No GUI. No Aero.
