narrative.title=official Beta 1.7.3 inert-solid bounded stability envelope
narrative.claim=One data-driven mini-subsystem exercises fifteen non-singular simple solids through a maintained public stability TestKit family on the unmodified official Beta 1.7.3 server. Each row proves bounded tick stability and causal response to direct stone-overhead removal as two Functional Census claims rather than separate micro-milestones.
narrative.cycle=DataDrivenCycle compiles one caller-owned solid matrix and runs thirty claims in fifteen fresh official worlds per pass. Every row gameplay-places its target under a stone overhead, holds the target across a two-hundred-tick observation window, removes that direct neighbor with a diamond pickaxe, observes the unchanged target for forty more ticks, and crosses a fresh-login persistence boundary.

