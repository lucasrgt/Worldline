narrative.schema=1
narrative.title=official Beta 1.7.3 vegetation ecology subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps grass, saplings, leaves, tall grass, crops, and sugar cane across nineteen unresolved archetype claims: six reachable metadata domains, five native collision envelopes, four light-table pairs, and four neighbor responses. Existing registry, lifecycle, drops, persistence, random ticks, rendering, and already-qualified plant dimensions remain independently owned and are not counted here.
narrative.cycle=Run executes two fresh mapped worlds and two untouched official-server worlds. Every replica prepares the native substrate matrix, enumerates the six bounded metadata domains, measures full and passable collision, inspects the four claimed opacity and emission pairs, preserves grass under a direct neighbor event, removes sapling and crop support, and marks leaves for decay by removing an adjacent log through VegetationEcologyFixture.
