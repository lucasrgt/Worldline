narrative.title=official Beta 1.7.3 gold-shovel harvest lifecycle family
narrative.claim=One independently signed public TestKit family executes sand, gravel, snow layer, snow block, clay, and soul sand against the unmodified official Beta 1.7.3 server. Every row proves placement, two fresh-login persistence boundaries, break to air, exact post-break tool state, and the complete set of newly spawned item entities. The family covers self drops, block-to-item transformations, and four-entity multiplicity for snow block and clay.
narrative.cycle=DataDrivenCycle compiles the reusable lifecycle-family harness and six caller-owned rows, runs them in fresh official server workspaces, repeats the entire family, compares canonical evidence byte-for-byte, and requires clean provider-owned shutdown. Gravel randomness is bounded to the fixed official seed and fresh-world fixture; this family does not claim the gravel-to-flint probability distribution.

