narrative.title=spider daylight aggression
narrative.claim=M661 freezes the official Beta 1.7.3 spider target-selection differential. One spider and one nearby player retain their identities and cells while open-sky daylight produces no target. After the only environmental change, time 6000 to 14000, the same spider selects exactly that player within the declared four-probe maximum. Leap, pursuit motion, damage, drops, and natural spawning are not claimed.
narrative.cycle=Run compares two fresh mapped executions with two direct official-server oracle executions. Each in-memory world joins one native spider and one native player three blocks apart on unchanged open-sky stone geometry. Both paths calculate daylight at time 6000, exhaust the bounded daylight probes without a target, change only time to 14000, and require the same player from the same spider within the four-probe bound. Equatable public evidence normalizes process-local entity IDs into explicit identity and geometry preservation facts; it records the maximum rather than a successful probe number.
