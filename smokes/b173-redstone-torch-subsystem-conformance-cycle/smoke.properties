narrative.schema=1
narrative.title=official Beta 1.7.3 redstone torch subsystem conformance
narrative.claim=One public TestKit mini-subsystem maps the idle and active redstone torch blocks as one inverter. It proves every support face, signal-only idle materialization, idle lifecycle and item drop, chunk-NBT persistence, collision and light envelopes, the native two-tick inversion, the eight-cycle burnout threshold and recovery window, and support invalidation.
narrative.cycle=Run executes two fresh mapped worlds and two fresh untouched official-server worlds. Every replica inverts all five supported metadata faces, cycles one torch through the native burnout threshold, proves it remains idle through the hundred-tick history window and recovers after expiration plus the scheduled delay, breaks and reloads idle state, measures collision and light tables, and removes support through RedstoneTorchSubsystemFixture.
