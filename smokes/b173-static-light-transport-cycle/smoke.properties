narrative.claim=One public TestKit family compares open-air controls with gameplay-placed glass, leaves, ice, torch, glowstone, lit redstone torch, and jack-o-lantern treatments on the unmodified official Beta 1.7.3 server. Exact sky-light attenuation and block-light emission decay are sampled from fresh full-chunk planes in seven isolated worlds.
narrative.cycle=DataDrivenCycle compiles the reusable light TestKit contract, official-server provider, and seven caller-owned rows. Every row proves exact item consumption and block state, reconnects for a fresh Packet51 light plane, then records exact source and propagation levels as equatable evidence.

