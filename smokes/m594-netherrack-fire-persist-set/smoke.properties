narrative.claim=Fire on netherrack persists across a long observation window while fire on wood or planks expires. This is distinct from flint-and-steel stone ignition and from fire-support extinguish. Overworld netherrack is sufficient.
narrative.cycle=DataDrivenCycle boots two official Beta 1.7.3 server JVMs. Each run raises an isolated stone column, places netherrack 87 and planks 5, ignites both with flint and steel 259, then requires the netherrack flame to remain while the plank flame expires. Headless B173WireClient protocol-14 only. No GUI. No Aero.
