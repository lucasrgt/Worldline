narrative.title=official Beta 1.7.3 special-collision physical envelopes
narrative.claim=One data-driven mini-subsystem exercises cobweb, snow-layer, cactus, and soul-sand through the public state-domain, collision, and light TestKit families on the unmodified official Beta 1.7.3 server. It closes twelve Functional Census claims for reachable placed state, non-full-cube collision envelopes, and source-cell light transport.
narrative.cycle=DataDrivenCycle compiles one caller-owned special-collision catalog and runs three maintained public TestKit families. Each dimension owns four fresh worlds, exact inventory consumption, canonical evidence, and a fresh-login persistence boundary; collision uses official AABB probes and light samples exact source skylight.

